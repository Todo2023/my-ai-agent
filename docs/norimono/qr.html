<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>のりもの ぶーん — QR</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#d9f2ff" />
<style>
  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 20px 56px;
    background: #eef7ff;
    color: #3a5570;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    text-align: center;
  }
  h1 { margin: 0; font-size: clamp(22px, 6vw, 32px); }
  p  { margin: 0; line-height: 1.8; max-width: 30em; }
  img { width: min(72vw, 320px); height: auto; background: #fff; padding: 12px; border-radius: 16px; }
  code { background: #d9e8f5; padding: 3px 8px; border-radius: 6px; font-size: 14px; word-break: break-all; }
  ol { text-align: left; line-height: 2; max-width: 26em; }
  .note { font-size: 13px; opacity: .75; }
  @media print { body { background: #fff; } .note { display: none; } }
</style>
</head>
<body>
<h1>のりもの ぶーん</h1>
<p>さわると扉がひらいて、のりものが出てきます。0〜2歳向け。<br />
一度ひらけば、<strong>電波のないところでも遊べます</strong>。</p>
<img src="./qr.png" alt="読み取ると、のりもの ぶーん が開きます" />
<code>https://todo2023.github.io/my-ai-agent/norimono/</code>
<ol>
  <li>QRを読み取ってひらく</li>
  <li>ブラウザのメニュー →「ホーム画面に追加」</li>
  <li>あとはアイコンから。通信は要りません</li>
</ol>
<p class="note">音が出ないときは、右上のボタンを0.7秒ほど長押しすると切り替わります。<br />
左下の 🎹 で音いろ（オルゴール・もっきん・ピアノ・ふえ・ギター）が変わります。</p>
</body>
</html>
