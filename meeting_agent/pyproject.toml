[project]
name = "meeting-agent"
version = "0.1.0"
description = "GoogleカレンダーのMeet URLをChatworkに共有するエージェント"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.0",
    "google-genai>=2.16.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
