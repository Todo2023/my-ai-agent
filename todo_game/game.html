<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>トドの晩酌</title>
<meta name="description" content="回転レーンの皿の蓋を開けて、ご注文と同じ品をトドに食べさせるゲーム。" />
<link rel="canonical" href="./game.html" />
<meta name="theme-color" content="#0b1220" />
<meta name="color-scheme" content="dark" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="晩酌" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="./game.css" />
</head>
<body>
<div class="sign">
  <h1>トドの晩酌</h1>
  <p>手前に来た皿の蓋を開ける</p>
</div>

<div class="cabinet">
  <canvas id="game" width="460" height="720" tabindex="0"
    aria-label="回転レーンを流れてくる皿の蓋を開け、ご注文と同じ品ならトドが食べる。手前の皿をタップ、またはスペースキー。"></canvas>
</div>

<div class="bar">
  <button id="howBtn" type="button">あそびかた</button>
  <button id="againBtn" type="button">はじめから</button>
  <button id="muteBtn" type="button">🔊 音あり</button>
</div>

<script src="./game.js" defer></script>
<script>
  // オフラインでも遊べるように。file:// で開いたときは何もしない。
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  }

</script>
</body>
</html>
