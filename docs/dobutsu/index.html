<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>どうぶつ めくり</title>
<meta name="description" content="どうぶつの えを さわると、その どうぶつが でてくる おはなしが うごきだす。9ひきぶん。" />
<meta name="theme-color" content="#12331f" />
<meta name="color-scheme" content="light" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<!-- えらぶ画面 -->
<main id="home">
  <header>
    <h1>どうぶつ めくり</h1>
    <p class="lead">どうぶつを さわると、その どうぶつの おはなしが はじまります。</p>
  </header>

  <div id="grid" class="grid"></div>

  <label class="voice">
    <input type="checkbox" id="voiceHome" checked />
    <span>よみあげる</span>
  </label>

  <footer>
    ぜんぶ この なかで うごきます。つうしんも、アカウントも いりません。
  </footer>
</main>

<!-- おはなしの画面 -->
<section id="player" class="player" hidden aria-hidden="true">
  <div class="bar">
    <button id="back" class="icon" aria-label="もどる">←</button>
    <span id="title" class="title"></span>
    <label class="voice small">
      <input type="checkbox" id="voice" checked />
      <span>よみあげ</span>
    </label>
  </div>

  <div class="stagewrap">
    <canvas id="stage" width="360" height="270" role="img" aria-label="おはなしの えいぞう"></canvas>
  </div>
  <p id="caption" class="caption" aria-live="polite"></p>

  <div id="dots" class="dots"></div>

  <div class="controls">
    <button id="prev" class="ctrl" aria-label="まえの ばめん">◀</button>
    <button id="play" class="ctrl big" aria-label="とめる">■</button>
    <button id="next" class="ctrl" aria-label="つぎの ばめん">▶</button>
    <button id="again" class="ctrl" aria-label="はじめから">↺</button>
  </div>
</section>

<script src="./draw.js"></script>
<script src="./stories.js"></script>
<script src="./app.js"></script>
</body>
</html>
