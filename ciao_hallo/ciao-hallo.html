<title>Ciao Hallo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* レイアウト：上に固定ヘッダー（言語・出発まで・時計＋国旗帯）、中央に1列の作業面、下に5タブ。片手操作のスマホ前提 */
:root{
  --bg:#eef1ee; --surface:#ffffff; --ink:#17201b; --muted:#5b675f; --line:#d9dfda;
  --it:#14774a; --nl:#c4520a; --accent:var(--it); --on-accent:#ffffff;
  --good:#1d7f47; --bad:#bf3324; --flag-w:#ffffff;
  --it-r:#c8312f; --nl-r:#b5242c; --nl-b:#21468b;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1a1f1c; --ink:#e8ede9; --muted:#97a39b; --line:#2b332e;
  --it:#43c483; --nl:#ff8b3e; --on-accent:#0c110e; --good:#4fcf88; --bad:#ff6d5c; --flag-w:#d8ddd9;
  --it-r:#e0524f; --nl-r:#e0525a; --nl-b:#5b80cf; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a1f1c; --ink:#e8ede9; --muted:#97a39b; --line:#2b332e;
  --it:#43c483; --nl:#ff8b3e; --on-accent:#0c110e; --good:#4fcf88; --bad:#ff6d5c; --flag-w:#d8ddd9;
  --it-r:#e0524f; --nl-r:#e0525a; --nl-b:#5b80cf; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  --accent:var(--it); --soft:color-mix(in srgb,var(--accent) 13%,var(--surface));
  --f1:var(--it); --f2:var(--flag-w); --f3:var(--it-r)}
body[data-lang="nl"]{--accent:var(--nl); --f1:var(--nl-r); --f2:var(--flag-w); --f3:var(--nl-b)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

/* ヘッダー */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-in{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:10px 8px;display:grid;gap:6px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1}
.brand b{color:var(--accent);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.meta strong{color:var(--ink);font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.flag{height:4px;background:linear-gradient(90deg,var(--f1) 0 33.33%,var(--f2) 33.33% 66.66%,var(--f3) 66.66%)}

/* 本体 */
main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.stack{display:grid;gap:14px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.hint{font-size:12.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px 16px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip small{color:var(--muted);margin-left:4px;font-family:var(--f-mono);font-size:11px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}

.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
.field::placeholder{color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.big{padding:12px 18px;font-size:15px}
.btn.on{background:var(--soft);border-color:var(--accent);color:var(--ink)}
.btn.star[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}

/* フレーズ一覧 */
.list{display:grid}
.ph{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:4px;min-width:0}
.ph:first-child{border-top:0}
.ph-ja{font-size:13.5px;color:var(--muted);font-weight:500}
.ph-fl{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.2;overflow-wrap:anywhere}
.ph-kana{font-size:13px;color:var(--accent);font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.note{margin:6px 0 0;padding:8px 12px;border-radius:10px;background:var(--soft);font-size:13.5px}
.lv{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.lv i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.lv i.f{background:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* カード */
.card{min-height:230px;display:grid;place-items:center;text-align:center;padding:24px 18px;cursor:pointer;gap:8px}
.card .q{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.2;overflow-wrap:anywhere}
.card .q.ja{font-family:var(--f-body);font-size:24px}
.card .a{display:grid;gap:4px;border-top:1px dashed var(--line);padding-top:12px;width:100%}
.card .tap{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.split > *{flex:1}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent)}

/* クイズ */
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.opt.fl{font-family:var(--f-display);font-weight:700;font-size:18px}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.ng{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.score{font-family:var(--f-display);font-weight:700;font-size:54px;line-height:1}

/* ルート */
.clocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.clock{padding:10px 12px}
.clock .t{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;text-align:center;line-height:1.25}
.day b{display:block;font-family:var(--f-mono);font-size:15px}
.day small{font-size:11px;color:var(--muted)}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.day .n{display:block;font-size:10.5px;color:var(--accent);font-weight:700;min-height:1.2em}
.stop{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.stop .tm{font-family:var(--f-mono);font-size:15px;padding-top:2px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:2px;color:var(--on-accent)}
.tag.it{background:var(--it)} .tag.nl{background:var(--nl)}
.form{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px}
.form .full{grid-column:1/-1}
a.link{color:var(--accent);font-weight:700;text-decoration:none}
a.link:hover{text-decoration:underline}

/* 記録 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{padding:12px 14px}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1}
.stat .v small{font-size:14px;color:var(--muted);font-weight:500}
.catrow{display:grid;grid-template-columns:84px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.catrow .mono{text-align:right;color:var(--muted);font-size:12px}
textarea.field{min-height:120px;font-family:var(--f-mono);font-size:12px}

/* 見せる（全画面） */
.show{position:fixed;inset:0;z-index:40;background:var(--surface);display:grid;place-items:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.show-in{max-width:720px;width:100%;display:grid;gap:18px;text-align:center}
.show-fl{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,9vw,64px);line-height:1.15;overflow-wrap:anywhere;margin:0}
.show-ja{font-size:16px;color:var(--muted);margin:0}
.show-lead{font-size:13px;color:var(--accent);font-weight:700;margin:0;letter-spacing:.04em}

/* 下部タブ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:transparent;padding:9px 0 10px;font-size:12px;color:var(--muted);display:grid;justify-items:center;gap:3px;font-weight:500}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;max-width:calc(100% - 32px)}
@media (max-width:420px){.ph-fl{font-size:21px}.clock .t{font-size:19px}.form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.opt,.day{transition:background .15s,border-color .15s}}
</style>

<header class="top">
  <div class="top-in">
    <div class="top-row">
      <h1 class="brand">Ciao <b>Hallo</b></h1>
      <div class="seg" role="group" aria-label="言語">
        <button id="lang-it" data-act="lang" data-v="it">イタリア語</button>
        <button id="lang-nl" data-act="lang" data-v="nl">オランダ語</button>

    </div>
    <div class="meta" id="meta"></div>

<main id="view"></main>

    <button data-act="tab" data-v="card"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v10"/></svg>カード</button>
    <button data-act="tab" data-v="quiz"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>クイズ</button>
    <button data-act="tab" data-v="route"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>ルート</button>

</nav>

<div class="show" id="show" hidden role="dialog" aria-modal="true" aria-label="現地の人に見せる">
  <div class="show-in">

    <p class="show-ja" id="show-ja"></p>

      <button class="btn big" data-act="show-say">聞く</button>
      <button class="btn big primary" data-act="show-close">閉じる</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

const $=s=>document.querySelector(s);

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
function ymd(tz,d=new Date()){return new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(d)}
function hm(tz,d=new Date()){return new Intl.DateTimeFormat("ja-JP",{timeZone:tz,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(d)}
const today=()=>ymd("Asia/Tokyo");
const dnum=s=>{const[y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)/864e5};
const WD="日月火水木金土";
const dayLabel=s=>{const[y,m,d]=s.split("-").map(Number);return{md:m+"/"+d,wd:WD[new Date(Date.UTC(y,m-1,d)).getUTCDay()]}};
function markDay(){const t=today();if(!S.days.includes(t)){S.days.push(t);S.days.sort()}}

/* 学習段階：初回「覚えた」で2、以後+1で3（習得済み）。間違い・「まだ」は1へ */
function learn(id){const b=S.box[S.lang],v=b[id]||0;b[id]=v<2?2:3;markDay()}
function miss(id){S.box[S.lang][id]=1;const m=S.miss[S.lang];m[id]=(m[id]||0)+1;markDay()}

/* ---------- 音声（端末のTTS） ---------- */
function speak(text,slow,lang=S.lang){
  if(!("speechSynthesis" in window)){toast("この端末では音声読み上げが使えません");return}
  const u=new SpeechSynthesisUtterance(text.replace(/\.\.\./g," ").replace(/\s*\/\s*/g,", "));
  u.lang=L[lang].code;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").toLowerCase().startsWith(lang));
  if(v)u.voice=v;
  u.rate=slow?0.6:0.95;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
if("speechSynthesis" in window){try{speechSynthesis.getVoices()}catch(e){}}

  return o.map(([v,n])=>`<option value="${v}"${v===sel?" selected":""}>${esc(n)}</option>`).join("");
}
function pool(scope){
  if(scope==="fav")return P.filter(p=>S.fav[S.lang][p[0]]);
  if(scope==="todo")return P.filter(p=>box(p[0])<3);
  if(scope.startsWith("cat:")){const c=scope.slice(4);return P.filter(p=>p[0][0]===c)}
  return P.slice();
}

/* ---------- クイズ ---------- */
function startQuiz(){
  const src=pool(U.qScope);
  if(!src.length){toast("この範囲にはフレーズがありません");return}
  const picks=shuffle(src).slice(0,U.qCount);
  const ans=p=>U.qType==="ja"?fl(p):p[1];
  const qs=picks.map(p=>{
    const same=shuffle(P.filter(o=>o[0]!==p[0]&&o[0][0]===p[0][0]&&ans(o)!==ans(p)));
    const rest=shuffle(P.filter(o=>o[0]!==p[0]&&o[0][0]!==p[0][0]&&ans(o)!==ans(p)));
    const dis=[];for(const o of same.concat(rest)){if(dis.length>=3)break;if(!dis.some(d=>ans(d)===ans(o)))dis.push(o)}
    return{id:p[0],opts:shuffle([p,...dis]).map(o=>o[0]),pick:null};
  });
  U.quiz={type:U.qType,qs,i:0,ok:0,done:false};
  if(U.qType==="audio")speak(fl(BY[qs[0].id]));
}

          .map(([v,n,d])=>`<button class="opt${U.qType===v?" ok":""}" data-act="qtype" data-v="${v}"><b>${esc(n)}</b><br><span class="hint">${d}</span></button>`).join("")}
      </div>
      <div class="eyebrow">問題数</div>
      <div class="seg" role="group" aria-label="問題数">${[5,10,20].map(n=>`<button data-act="qcount" data-v="${n}" aria-pressed="${U.qCount===n}">${n}問</button>`).join("")}</div>
      <div class="eyebrow">範囲</div>
      <select class="field" id="qScope" aria-label="出題範囲">${scopeOptions(U.qScope)}</select>
      <button class="btn big primary" data-act="qstart">はじめる</button>
    </div>
    <p class="hint">正解したフレーズは習得段階が1つ進み、間違えたフレーズは「記録」の苦手リストに入ります。</p>
  </div>`;
  if(z.done){
    const wrong=z.qs.filter(q=>q.pick!==q.id);
    return `<div class="stack">
      <div class="panel pad stack" style="text-align:center">
        <div class="eyebrow">結果</div>
        <div class="score">${z.ok}<span style="font-size:24px;color:var(--muted)"> / ${z.qs.length}</span></div>
        <p class="hint" style="margin:0">${z.ok===z.qs.length?"全問正解です。":"間違えたフレーズを下で確認しましょう。"}</p>
        <div class="row" style="justify-content:center"><button class="btn big" data-act="qsetup">設定を変える</button><button class="btn big primary" data-act="qstart">もう一度</button></div>
      </div>
      ${wrong.length?`<div class="eyebrow">間違えたフレーズ</div><div class="panel list">${wrong.map(q=>phraseRow(BY[q.id])).join("")}</div>`:""}
    </div>`;
  }
  const q=z.qs[z.i],p=BY[q.id];
  const prompt=z.type==="ja"?`<div class="q ja">${esc(p[1])}</div>`
    :z.type==="fl"?`<div class="q" lang="${S.lang}">${esc(fl(p))}</div>`
    :`<button class="btn big primary" data-act="say" data-id="${q.id}">もう一度聞く</button><button class="btn" data-act="slow" data-id="${q.id}">ゆっくり</button>`;
  const optTxt=o=>z.type==="ja"?fl(BY[o]):BY[o][1];
  return `<div class="stack">
    <div class="bar" aria-hidden="true"><span style="width:${Math.round(z.i/z.qs.length*100)}%"></span></div>
    <div class="hint">${z.i+1} / ${z.qs.length} 問　正解 ${z.ok}</div>
    <div class="panel card" style="cursor:default;min-height:150px"><div style="display:grid;gap:10px;justify-items:center">
      <div class="eyebrow">${esc(CATNAME[q.id[0]])}</div>${prompt}</div></div>
    <div class="opts">${q.opts.map(o=>{
      let cls="opt"+(z.type==="ja"?" fl":"");
      if(q.pick){if(o===q.id)cls+=" ok";else if(o===q.pick)cls+=" ng"}
      return `<button class="${cls}" data-act="qans" data-v="${o}" ${q.pick?"disabled":""}>${esc(optTxt(o))}</button>`}).join("")}</div>
    ${q.pick?`<div class="panel pad" style="display:grid;gap:2px">
        <div class="ph-ja">${esc(p[1])}</div><div class="ph-fl" lang="${S.lang}">${esc(fl(p))}</div><div class="ph-kana">${esc(kana(p))}</div>
      </div>
      <button class="btn big primary" data-act="qnext">${z.i+1<z.qs.length?"次へ":"結果を見る"}</button>`:""}
  </div>`;
}

/* ---------- ルート ---------- */
function mapSearch(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)}
function mapDir(stops){
  const qs=stops.map(s=>s.q||s.name);
  if(qs.length===1)return mapSearch(qs[0]);
  let u="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(qs[0])+"&destination="+encodeURIComponent(qs[qs.length-1]);
  if(qs.length>2)u+="&waypoints="+encodeURIComponent(qs.slice(1,-1).join("|"));
  return u+"&travelmode=walking";
}
const dayStops=d=>(S.route[d]||[]).slice().sort((a,b)=>a.t.localeCompare(b.t));
function viewRoute(){
  const stops=dayStops(U.day),f=U.form,fl_=f.l||S.lang,sl=U.spotLang||S.lang;
  return `<div class="stack">
    <div class="clocks">
      ${[["ローマ","Europe/Rome"],["アムステルダム","Europe/Amsterdam"],["東京","Asia/Tokyo"]].map(([n,tz])=>`<div class="panel clock"><div class="hint">${n}</div><div class="t" data-tz="${tz}">${hm(tz)}</div></div>`).join("")}
    </div>
    <p class="hint" style="margin:-4px 0 0">11月のローマとアムステルダムは同じ時刻。日本との時差は −8時間（夏時間は自動で反映）。</p>
    <div class="days" role="group" aria-label="日付">
      ${TRIP.map((d,i)=>{const l=dayLabel(d),n=(S.route[d]||[]).length;return `<button class="day" data-act="day" data-v="${d}" aria-pressed="${U.day===d}"><small>${i+1}日目</small><b>${l.md}</b><small>${l.wd}</small><span class="n">${n?n+"件":""}</span></button>`}).join("")}
    </div>
    <div class="panel">
      ${stops.length?stops.map(s=>`<div class="stop">
          <div class="tm">${esc(s.t)}</div>
          <div style="min-width:0;display:grid;gap:2px">
            <div><span class="tag ${s.l==="nl"?"nl":"it"}">${s.l==="nl"?"NL":"IT"}</span><b>${esc(s.name)}</b></div>
            ${s.note?`<div class="hint">${esc(s.note)}</div>`:""}
            <div class="row" style="margin-top:4px"><a class="link" href="${esc(mapSearch(s.q||s.name))}" target="_blank" rel="noopener">地図で開く</a>
            <button class="btn" data-act="sdel" data-k="${esc(s.t+"|"+s.name)}" style="margin-left:auto">削除</button></div>
          </div></div>`).join("")
        :`<div class="empty">${dayLabel(U.day).md} の予定はまだありません。<br>下のフォームか人気スポットから追加できます。</div>`}
    </div>
    ${stops.length?`<a class="btn big primary" style="text-align:center;text-decoration:none" href="${esc(mapDir(stops))}" target="_blank" rel="noopener">この日の順路をGoogleマップで開く</a>`:""}
    <form class="panel pad stack" id="stopForm">
      <div class="eyebrow">${dayLabel(U.day).md} に予定を追加</div>
      <div class="form">
        <input class="field" id="f-t" type="time" value="${esc(f.t)}" required aria-label="時刻">
        <input class="field" id="f-name" placeholder="場所の名前（例：コロッセオ）" value="${esc(f.name)}" required aria-label="場所の名前">
        <input class="field full" id="f-q" placeholder="地図検索用の現地表記（例：Colosseo, Roma）" value="${esc(f.q)}" aria-label="地図検索用の表記">
        <input class="field full" id="f-note" placeholder="メモ（予約番号・集合場所など）" value="${esc(f.note)}" aria-label="メモ">
        <select class="field full" id="f-l" aria-label="国">
          <option value="it"${fl_==="it"?" selected":""}>イタリア</option><option value="nl"${fl_==="nl"?" selected":""}>オランダ</option>
        </select>
      </div>
      <button class="btn big primary" type="submit">追加する</button>
    </form>
    <div class="panel pad stack">
      <div class="row"><div class="eyebrow">人気スポット</div>
        <div class="seg" style="margin-left:auto" role="group" aria-label="国">
          <button data-act="spotlang" data-v="it" aria-pressed="${sl==="it"}">イタリア</button>
          <button data-act="spotlang" data-v="nl" aria-pressed="${sl==="nl"}">オランダ</button>
        </div></div>
      <div class="row">${SPOTS[sl].map((s,i)=>`<button class="chip" data-act="spot" data-l="${sl}" data-i="${i}">${esc(s[0])}</button>`).join("")}</div>
      <p class="hint" style="margin:0">タップするとフォームに入ります。時刻を決めて「追加する」を押してください。</p>
    </div>
    ${shareBlock()}
  </div>`;
}
function addStop(d,s){
  const arr=S.route[d]||(S.route[d]=[]);
  if(arr.some(x=>x.t===s.t&&x.name===s.name))return false;
  arr.push(s);return true;
}

/* ---------- 共有（書き出し・読み込み） ---------- */
function shareBlock(){
  return `<div class="panel pad stack">
    <div class="eyebrow">2人で共有する</div>
    <p class="hint" style="margin:0">ルートとお気に入りをファイルに書き出し、相手のアプリで読み込みます。同じ予定は重複しません。習得状況は個人のものなので共有しません。</p>
    <div class="row">
      <button class="btn primary" data-act="export">書き出す</button>
      <label class="btn" for="importFile" style="cursor:pointer">読み込む</label>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>
    ${U.shareMsg?`<p class="hint" style="margin:0;color:var(--ink)">${esc(U.shareMsg)}</p>`:""}
    ${U.shareText?`<textarea class="field" id="shareText" readonly aria-label="書き出したデータ">${esc(U.shareText)}</textarea>
      <div class="row"><button class="btn" data-act="copy">コピーする</button><span class="hint">保存できない環境では、この文字列をメッセージで送ってください。</span></div>`:""}
    <details><summary class="hint" style="cursor:pointer">文字列を貼り付けて読み込む</summary>
      <div class="stack" style="margin-top:8px"><textarea class="field" id="pasteText" placeholder='{"app":"ciao-hallo", ...}' aria-label="読み込むデータ"></textarea>
      <button class="btn" data-act="importPaste">貼り付けた内容を読み込む</button></div></details>
  </div>`;
}
function exportData(){return JSON.stringify({app:"ciao-hallo",version:2,exported:new Date().toISOString(),route:S.route,fav:S.fav},null,1)}
async function doExport(){
  const data=exportData(),name="ciao-hallo-"+today()+".json";
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
  if(dl){
    try{await dl.save({filename:name,data});U.shareMsg="書き出しました（"+name+"）。相手に送って「読み込む」で取り込んでもらいます。";U.shareText="";render();return}
    catch(e){if(e&&e.code==="declined"){U.shareMsg="保存をキャンセルしました。";render();return}}
  }
  U.shareText=data;U.shareMsg="この環境ではファイル保存ができないため、下の文字列をコピーして相手に送ってください。";render();
}
function importData(txt){
  let o;try{o=JSON.parse(txt)}catch(e){U.shareMsg="読み込めませんでした。Ciao Hallo で書き出したファイルか確認してください。";render();return}
  if(!o||o.app!=="ciao-hallo"){U.shareMsg="Ciao Hallo のデータではないようです。";render();return}
  let added=0,favs=0;
  for(const[d,arr]of Object.entries(o.route||{})){if(!Array.isArray(arr))continue;
    for(const s of arr){if(s&&typeof s.t==="string"&&typeof s.name==="string"){
      if(addStop(d,{t:s.t,name:s.name,q:String(s.q||""),note:String(s.note||""),l:s.l==="nl"?"nl":"it"}))added++}}}
  for(const l of["it","nl"])for(const id of Object.keys((o.fav||{})[l]||{}))if(BY[id]&&!S.fav[l][id]){S.fav[l][id]=1;favs++}
  save();U.shareMsg=`読み込みました。予定 ${added} 件、お気に入り ${favs} 件を追加しました。`;U.shareText="";render();
}

/* ---------- 記録 ---------- */
function streak(){
  const set=new Set(S.days);let d=dnum(today());
  if(!set.has(today()))d-=1;
  let n=0;const iso=x=>new Date(x*864e5).toISOString().slice(0,10);
  while(set.has(iso(d))){n++;d--}
  return n;
}
function viewLog(){
  const mast=l=>P.filter(p=>(S.box[l][p[0]]||0)>=3).length;
  const seen=l=>P.filter(p=>(S.box[l][p[0]]||0)>=2).length;
  const weak=Object.entries(S.miss[S.lang]).filter(([id])=>BY[id]).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const acc=S.quiz.n?Math.round(S.quiz.ok/S.quiz.n*100):null;
  return `<div class="stack">
    <div class="stats">
      ${["it","nl"].map(l=>`<div class="panel stat"><div class="hint">${L[l].name} 習得</div><div class="v">${Math.round(mast(l)/P.length*100)}<small>%</small></div><div class="hint">${mast(l)} / ${P.length}（覚えた ${seen(l)}）</div></div>`).join("")}
      <div class="panel stat"><div class="hint">連続学習</div><div class="v">${streak()}<small>日</small></div><div class="hint">学習した日 合計 ${S.days.length} 日</div></div>
      <div class="panel stat"><div class="hint">クイズ正答率</div><div class="v">${acc==null?"—":acc}<small>${acc==null?"":"%"}</small></div><div class="hint">${S.quiz.ok} / ${S.quiz.n} 問</div></div>
    </div>
    <div class="panel pad">
      <div class="eyebrow" style="margin-bottom:6px">カテゴリ別の習得（${L[S.lang].name}）</div>
      ${CATS.map(([k,n])=>{const ps=P.filter(p=>p[0][0]===k),m=ps.filter(p=>box(p[0])>=3).length;
        return `<div class="catrow"><span>${esc(n)}</span><div class="bar"><span style="width:${Math.round(m/ps.length*100)}%"></span></div><span class="mono">${m}/${ps.length}</span></div>`}).join("")}
    </div>
    <div>
      <div class="eyebrow" style="margin-bottom:6px">苦手なフレーズ（${L[S.lang].name}）</div>
      <div class="panel list">${weak.length?weak.map(([id])=>phraseRow(BY[id])).join(""):`<div class="empty">クイズで間違えたり、カードで「まだ」を押したフレーズがここに並びます。</div>`}</div>
    </div>
    ${shareBlock()}
    <div class="panel pad stack">
      <div class="eyebrow">リセット</div>
      ${U.reset?`<p style="margin:0">習得状況・お気に入り・クイズ成績・ルートをすべて消します。元に戻せません。</p>
        <div class="row"><button class="btn danger" data-act="resetGo">すべて消す</button><button class="btn" data-act="resetNo">やめる</button></div>`
        :`<div><button class="btn danger" data-act="resetAsk">学習記録をリセット…</button></div>`}
    </div>
  </div>`;
}

/* ---------- 描画とイベント ---------- */
function render(){
  renderChrome();
  const v=$("#view");
  v.innerHTML=U.tab==="phrase"?viewPhrase():U.tab==="card"?viewCard():U.tab==="quiz"?viewQuiz():U.tab==="route"?viewRoute():viewLog();
  if(U.tab==="phrase")renderList();
}
function refreshRows(){if(U.tab==="phrase")renderList();else render()}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  switch(a){
    case"tab":U.tab=v;U.reset=false;render();window.scrollTo(0,0);break;
    case"lang":if(S.lang!==v){S.lang=v;U.card=null;U.quiz=null;U.form.l=null;U.spotLang=null;save();render()}break;
    case"cat":U.cat=v;renderList();document.querySelectorAll('[data-act="cat"]').forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===v)));break;
    case"filter":U.filter=v;render();break;
    case"say":speak(fl(BY[id]),false);break;
    case"slow":speak(fl(BY[id]),true);break;
    case"show":openShow(id);break;
    case"show-say":if(U.showId)speak(fl(BY[U.showId]),true);break;
    case"show-close":$("#show").hidden=true;U.showId=null;break;
    case"fav":{const f=S.fav[S.lang];if(f[id])delete f[id];else f[id]=1;save();refreshRows();break}
    case"learn":{const bx=S.box[S.lang];if((bx[id]||0)>=3){delete bx[id];toast("未習得に戻しました")}else{learn(id);toast(bx[id]>=3?"習得済みになりました":"覚えた！もう一度押すと習得済み")}save();refreshRows();break}
    case"note":U.open[id]=!U.open[id];refreshRows();break;
    case"cdir":U.cardDir=v;if(U.card)U.card.flip=false;render();break;
    case"flip":if(U.card){U.card.flip=!U.card.flip;render()}break;
    case"cyes":{const c=U.card,cid=c.queue.shift();learn(cid);c.done++;c.flip=false;save();render();break}
    case"cno":{const c=U.card,cid=c.queue.shift();miss(cid);c.queue.splice(Math.min(4,c.queue.length),0,cid);c.flip=false;save();render();break}
    case"crestart":startCards();render();break;
    case"qtype":U.qType=v;render();break;
    case"qcount":U.qCount=+v;render();break;
    case"qstart":startQuiz();render();window.scrollTo(0,0);break;
    case"qsetup":U.quiz=null;render();break;
    case"qans":{const z=U.quiz,q=z.qs[z.i];if(q.pick)break;q.pick=v;
      if(v===q.id){z.ok++;learn(q.id)}else miss(q.id);
      if(z.type!=="audio")speak(fl(BY[q.id]));save();render();break}
    case"qnext":{const z=U.quiz;z.i++;
      if(z.i>=z.qs.length){z.done=true;S.quiz.n+=z.qs.length;S.quiz.ok+=z.ok;save()}
      else if(z.type==="audio")speak(fl(BY[z.qs[z.i].id]));
      render();window.scrollTo(0,0);break}
    case"day":U.day=v;render();break;
    case"spotlang":U.spotLang=v;render();break;
    case"spot":{const s=SPOTS[b.dataset.l][+b.dataset.i];readForm();U.form.name=s[0];U.form.q=s[1];U.form.l=b.dataset.l;render();
      const n=$("#f-t");n&&n.focus();break}
    case"sdel":{const arr=S.route[U.day]||[];const i=arr.findIndex(s=>s.t+"|"+s.name===b.dataset.k);if(i>=0){arr.splice(i,1);if(!arr.length)delete S.route[U.day];save();render();toast("削除しました")}break}
    case"export":doExport();break;
    case"copy":{const t=$("#shareText");const txt=U.shareText;
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast("コピーしました"),()=>{t.select();toast("選択しました。コピーしてください")});
      else{t.select();toast("選択しました。コピーしてください")}break}
    case"importPaste":{const t=$("#pasteText");if(t&&t.value.trim())importData(t.value);break}
    case"resetAsk":U.reset=true;render();break;
    case"resetNo":U.reset=false;render();break;
    case"resetGo":{const lang=S.lang;S=blank();S.lang=lang;U.card=null;U.quiz=null;U.reset=false;save();render();toast("リセットしました");break}
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("#show").hidden){$("#show").hidden=true;U.showId=null}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches('.card[data-act="flip"]')){e.preventDefault();U.card.flip=!U.card.flip;render()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){U.q=e.target.value;renderList()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="cardScope"){U.cardScope=t.value;startCards();render()}
  if(t.id==="qScope"){U.qScope=t.value}
  if(t.id==="importFile"&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>importData(String(r.result));r.readAsText(t.files[0]);t.value=""}
});
function readForm(){
  const g=id=>{const el=$("#"+id);return el?el.value:""};
  if(!$("#stopForm"))return;
  U.form={t:g("f-t")||"10:00",name:g("f-name"),q:g("f-q"),note:g("f-note"),l:g("f-l")||null};
}
document.addEventListener("submit",e=>{
  if(e.target.id!=="stopForm")return;e.preventDefault();readForm();
  const f=U.form;if(!f.name.trim())return;
  const ok=addStop(U.day,{t:f.t,name:f.name.trim(),q:f.q.trim(),note:f.note.trim(),l:f.l==="nl"?"nl":"it"});
  if(!ok){toast("同じ時刻・同じ場所の予定がすでにあります");return}
  U.form={t:f.t,name:"",q:"",note:"",l:f.l};save();render();toast(dayLabel(U.day).md+" に追加しました");
});

render();
setInterval(renderMeta,20000);
</script>
