<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>書き手 | ハタラク文庫（仮）</title>
<meta name="theme-color" content="#0f766e" />
<meta name="color-scheme" content="light dark" />
<!--
  自分の欄を直す画面を兼ねている。**noindex は外さない。**
  検索に出したい書き手のページを作るなら、記事と同じように
  tools/ で静的に吐く（sekkei/hikitsugi-biz.md）。
-->
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M8 9h16M8 16h16M8 23h10' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<a class="skip" href="#main">本文へ</a>

<div class="demo-bar">
  <b>試作中</b>：書き手の欄です。公開されるのは表示名・紹介文・リンクだけで、メールアドレスは出ません。
</div>

<header>
  <div class="wrap bar">
    <a class="logo" href="./">ハタラク文庫<small>KARI · WORKING LIBRARY</small></a>
    <nav>
      <a href="./">記事一覧</a>
      <a href="write.html">書く</a>
    </nav>
  </div>
</header>

<main id="main" class="wrap profile">

  <!-- 見ているだけのとき -->
  <section class="who" id="who" hidden>
    <h1 id="name">読み込んでいます…</h1>
    <p class="handle" id="handle"></p>
    <p class="bio" id="bio"></p>
    <ul class="links" id="links"></ul>
    <button class="btn" id="to-edit" type="button" hidden>自分の欄を直す</button>
  </section>

  <p class="problems" id="problems" hidden></p>

  <!-- 自分の欄を直すとき -->
  <section class="edit-box" id="edit" hidden>
    <h2>自分の欄</h2>
    <div class="fields">
      <p class="f">
        <label for="f-handle">ID<b>必須</b></label>
        <input id="f-handle" type="text" maxlength="30" placeholder="todo-editor" spellcheck="false" autocapitalize="off" />
        <span class="hint" id="handle-hint">半角の英小文字・数字と <code>-</code> <code>_</code>。2〜30文字。<b>URLになるので、決めたら変えられない</b></span>
      </p>
      <p class="f">
        <label for="f-name">表示名<b>必須</b></label>
        <input id="f-name" type="text" maxlength="40" placeholder="To do 編集部" />
        <span class="hint">記事に出る名前</span>
      </p>
      <p class="f wide">
        <label for="f-bio">紹介</label>
        <textarea id="f-bio" maxlength="300" rows="3" placeholder="何をしている人か。300文字まで"></textarea>
      </p>
      <p class="f wide">
        <label for="f-links">リンク</label>
        <textarea id="f-links" rows="3" spellcheck="false" placeholder="https://example.com&#10;https://example.com/blog"></textarea>
        <span class="hint">1行に1つ。<code>https://</code> から書く。5つまで</span>
      </p>
    </div>
    <div class="actions">
      <button class="btn primary" id="save" type="button">保存する</button>
      <button class="btn" id="cancel" type="button" hidden>やめる</button>
      <span class="hint" id="save-note"></span>
    </div>
  </section>

  <!-- ログインの案内。自分の欄を開いたときだけ出る -->
  <div class="send" id="login-box" hidden>
    <p class="send-state" id="login-state"></p>
    <div class="send-row" id="login-row" hidden>
      <label class="skip" for="email">メールアドレス</label>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" />
      <button class="btn" id="login" type="button">ログインのリンクを送る</button>
      <button class="btn" id="logout" type="button" hidden>ログアウト</button>
    </div>
  </div>

  <section class="works" id="works" hidden>
    <h2>書いた記事<span class="count" id="count"></span></h2>
    <ul class="cards" id="cards"></ul>
    <p class="empty" id="empty" hidden>まだありません。</p>
  </section>

</main>

<footer>
  <div class="wrap">
    <p>ハタラク文庫（仮）— 合同会社To do の試作。</p>
  </div>
</footer>

<script src="config.js"></script>
<script type="module" src="profile.js"></script>
</body>
</html>
