<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>わんわん るーれっと</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ホーム画面（ルーレット） -->
<main id="home" class="screen is-active">
  <div id="tabs" class="tabs"><!-- videos.js から生成 --></div>

  <div class="wheel-wrap">
    <div class="wheel__pointer">▼</div>
    <div id="wheel" class="wheel">
      <svg id="wheelSvg" viewBox="-100 -100 200 200"><!-- JSで描画 --></svg>
    </div>
    <button id="spinBtn" class="spin">
      <span class="spin__label">まわす</span>
    </button>
  </div>

  <p class="hint">まんなかを おして！ すきなえを おしても みられるよ</p>
</main>

<!-- 再生画面 -->
<section id="player" class="screen player">
  <div class="player__stage">
    <div id="ytplayer"></div>
    <!-- 子どもの誤タップが YouTube 側に届かないようにするフタ -->
    <div class="player__shield" aria-hidden="true"></div>
    <div id="loading" class="player__loading">よみこみちゅう…</div>
  </div>
  <div class="player__controls">
    <button id="homeBtn" class="ctrl">🎡<span>るーれっと</span></button>
    <button id="playBtn" class="ctrl ctrl--main">⏸<span>とめる</span></button>
    <button id="nextBtn" class="ctrl">⏭<span>つぎ</span></button>
  </div>
</section>

<!-- おしまい画面（時間制限） -->
<section id="timeup" class="screen timeup">
  <div class="timeup__emoji">🌙</div>
  <p class="timeup__text">きょうは おしまい！<br>またあそぼうね</p>
  <button id="unlockBtn" class="unlock">おうちのかた：長押しでつづける</button>
</section>

<script src="videos.js"></script>
<script src="app.js"></script>
</body>
</html>
