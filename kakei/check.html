<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>インストール診断 — 家計のみらい</title>
<meta name="theme-color" content="#0c1416" />
<meta name="color-scheme" content="dark" />
<link rel="manifest" href="./manifest.webmanifest" />
<style>
  :root { --text: #e6f2ee; --dim: #8ba8a2; --mint: #4fd6a9; --ok: #4fd6a9; --ng: #f0748a; --warn: #f0c463; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: max(20px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    background: #0c1416;
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.1em; color: #d5f5e7; }
  p.lead { margin: 0; font-size: 12px; color: var(--dim); text-align: center; line-height: 1.9; max-width: 26em; }
  ul { list-style: none; margin: 0; padding: 0; width: min(100%, 460px); display: flex; flex-direction: column; gap: 8px; }
  li {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 11px 13px; border-radius: 10px;
    background: rgba(230,242,238,0.05); border: 1px solid rgba(230,242,238,0.10);
    font-size: 12.5px; line-height: 1.7;
  }
  li .k { color: var(--dim); flex: 0 0 8.5em; }
  li .v { flex: 1 1 auto; word-break: break-all; }
  .ok { color: var(--ok); }
  .ng { color: var(--ng); }
  .warn { color: var(--warn); }
  .actions { display: flex; flex-direction: column; gap: 10px; width: min(100%, 460px); }
  button, a.btn {
    font: inherit; font-size: 14px; font-weight: 600; text-align: center; text-decoration: none;
    color: var(--text); background: rgba(230,242,238,0.07);
    border: 1px solid rgba(230,242,238,0.16); border-radius: 999px; padding: 12px 18px; cursor: pointer;
  }
  a.btn.primary { color: #06211a; background: linear-gradient(180deg, #93e8ca, var(--mint)); border: none; }
</style>
</head>
<body>

<h1>インストール診断</h1>
<p class="lead">「入らない」「開いたら別のアプリが出た」ときはここを見てください。<br />そのままスクショを撮って渡せば、何が起きているか分かります。</p>

<ul id="list"></ul>

<div class="actions">
  <a class="btn primary" href="./">インストール画面へ</a>
  <a class="btn" href="./app.html">アプリを開く</a>
  <button type="button" id="reset">キャッシュを消して読み直す</button>
</div>

<script>
const list = document.getElementById("list");
const row = (k, v, cls) => {
  const li = document.createElement("li");
  li.innerHTML = `<span class="k"></span><span class="v ${cls || ""}"></span>`;
  li.children[0].textContent = k;
  li.children[1].textContent = v;
  list.appendChild(li);
  return li.children[1];
};

const ua = navigator.userAgent;
const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const iosSafari = ios && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|Chrome/.test(ua);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

row("いまのURL", location.href);
row("つなぎ方", location.protocol === "https:" ? "https（OK）" : location.protocol, location.protocol === "https:" ? "ok" : "ng");
row("起動のしかた", standalone ? "インストール済みのアイコンから" : "ブラウザで表示中");
row("端末", ios ? (iosSafari ? "iPhone / iPad（Safari）" : "iPhone / iPad（Safari以外）") : "Android またはパソコン");

if (ios && !iosSafari) {
  row("注意", "iOS では Safari 以外からホーム画面に追加できません。Safari で開き直してください。", "ng");
}

// 保存できるか。ここが駄目だと、入れた金額が次に開いたとき消えている
const store = row("保存（localStorage）", "確認中…");
try {
  localStorage.setItem("kakei-probe", "1");
  localStorage.removeItem("kakei-probe");
  const raw = localStorage.getItem("kakei-data");
  const n = raw ? (JSON.parse(raw).plans || []).length : 0;
  store.textContent = raw ? `使える（プラン ${n}件・${raw.length.toLocaleString("ja-JP")}バイト 保存ずみ）` : "使える（まだ空）";
  store.className = "v ok";
} catch (e) {
  store.textContent = "使えない：" + e + "（プライベートブラウズや、サイトデータのブロックが原因のことが多いです）";
  store.className = "v ng";
}

// manifest が読めているか
const man = row("manifest", "確認中…");
fetch("./manifest.webmanifest").then((r) => r.json()).then((m) => {
  man.textContent = `${m.name} / start_url: ${m.start_url}`;
  man.className = "v ok";
}).catch((e) => { man.textContent = "読めない：" + e; man.className = "v ng"; });

// いちばん大事：この階層を担当している Service Worker
const sw = row("Service Worker", "確認中…");
if (!("serviceWorker" in navigator)) {
  sw.textContent = "この端末では使えない";
  sw.className = "v ng";
} else {
  const home = new URL("./", location.href).href;
  const show = () => {
    const c = navigator.serviceWorker.controller;
    if (!c) { sw.textContent = "まだ担当なし（読み直すと付きます）"; sw.className = "v warn"; return; }
    const mine = c.scriptURL.startsWith(home);
    sw.textContent = mine ? "家計のみらいのもの（OK）" : `別アプリのものが担当中：${c.scriptURL}`;
    sw.className = mine ? "v ok" : "v ng";
  };
  navigator.serviceWorker.register("./sw.js").then(show).catch((e) => {
    sw.textContent = "登録できない：" + e; sw.className = "v ng";
  });
  navigator.serviceWorker.addEventListener("controllerchange", show);
  navigator.serviceWorker.getRegistrations().then((rs) => {
    row("登録されている範囲", rs.map((r) => r.scope).join("\n") || "なし");
  });
}

// インストールできる状態か
const inst = row("インストール", ios ? "iOS は共有 →「ホーム画面に追加」（ボタンは出ません）" : "確認中…", ios ? "warn" : "");
if (!ios) {
  let came = false;
  addEventListener("beforeinstallprompt", () => {
    came = true;
    inst.textContent = "できます（インストール画面のボタンが出ます）";
    inst.className = "v ok";
  });
  setTimeout(() => {
    if (came) return;
    inst.textContent = standalone
      ? "もう入っています"
      : "合図が来ません。すでに入っている／条件未達（数秒待つか、⋮メニューの「アプリをインストール」を試す）";
    inst.className = "v warn";
  }, 3500);
}

document.getElementById("reset").addEventListener("click", async () => {
  // 消すのはキャッシュと担当だけ。入れた金額（localStorage）には触らない
  try {
    if (self.caches) for (const k of await caches.keys()) if (k.startsWith("kakei-")) await caches.delete(k);
    const home = new URL("./", location.href).href;
    for (const r of await navigator.serviceWorker.getRegistrations()) {
      if (r.scope.startsWith(home)) await r.unregister();   // 自分の範囲だけ。他アプリには触らない
    }
  } catch (_) { /* 消せなくても読み直す */ }
  sessionStorage.removeItem("kakei-sw-heal");
  location.reload();
});
</script>
</body>
</html>
