# 管理画面（/admin）の設定ファイル。
# 「お知らせ」を、コードを触らずにブラウザから追加・編集・削除できるようにします。
# 通常このファイルを編集する必要はありません。

backend:
  name: git-gateway
  branch: main

# 画像をアップロードしたときの保存先
media_folder: "website/public/images"
public_folder: "/images"

locale: "ja"

collections:
  - name: "news"
    label: "お知らせ"
    label_singular: "お知らせ"
    folder: "website/src/content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { name: "title", label: "タイトル", widget: "string" }
      - { name: "date", label: "公開日", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "summary", label: "一覧に出る短い説明", widget: "text", required: false }
      - { name: "draft", label: "下書き（チェックすると公開されません）", widget: "boolean", default: false, required: false }
      - { name: "body", label: "本文", widget: "markdown" }
