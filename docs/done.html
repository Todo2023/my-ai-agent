<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 受講者限定。検索には載せない。 -->
<meta name="robots" content="noindex, nofollow">
<title>修了｜思考力×AI統合講座</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/lesson.css">
<link rel="stylesheet" href="assets/done.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="lessons.html">合同会社To<em>do</em> — 講座資料</a>
    <span class="navlinks">
      <a class="navlink" href="office.html">オフィスアワー →</a>
      <a class="navlink" href="topics.html">AI Topics →</a>
      <a class="navlink" href="lessons.html">資料の一覧 →</a>
    </span>
  </div>
</nav>

<main class="wrap" id="main">
  <div class="lesson-head"><p class="aim">読み込んでいます…</p></div>
</main>

<footer>合同会社Todo　思考力×AI統合講座　受講者向け資料</footer>

<script src="assets/course.js"></script>
<script>
/* 最後の回を出し終えた人の画面。
   「見た人が修了」ではなく、**サーバーが持っている提出の記録**で判定する。
   URLを直接開いただけの人には、まだ残っている回を出す。 */
(function () {
  var main = document.getElementById('main');
  var esc = Course.esc;


  /* 場面 → 戻る回。修了した人しか開けない画面なので、鍵は掛かったまま使えます */
  var SITUATIONS = [
    ['何を調べればいいか分からない', 'lesson-01', '問いを立てる'],
    ['AIの答えをそのまま使ってよいか迷う', 'lesson-02', 'AIとの役割分担'],
    ['調べ物が終わらない', 'lesson-03', '構造化・仮説構築'],
    ['要約を読んでも何も残らない', 'lesson-04', '情報収集・要約のAI活用'],
    ['どこまで調べるべきか分からない', 'lesson-05', 'リサーチ設計'],
    ['数字から何が言えるか分からない', 'lesson-06', 'データ整理・分析のAI活用'],
    ['書いても伝わらない', 'lesson-07', '結論から書く・話す'],
    ['文章が自分のものに思えない', 'lesson-08', '文章生成・提案書支援のAI活用'],
    ['発表がまとまらない', 'lesson-09', '発表・アウトプット'],
    ['同じ作業をくり返している', 'lesson-10', '自動化・ミニ制作'],
    ['指摘がこたえる', 'lesson-11', 'フィードバックを力に変える'],
    ['型を忘れてきた', 'lesson-12', 'AIとの付き合い方をアップデートし続ける']
  ];

  function backTo(d) {
    var open = {};
    d.lessons.forEach(function (x) { if (x.open) open[x.slug] = x.label; });
    return SITUATIONS.filter(function (r) { return open[r[1]]; }).map(function (r) {
      return '<a class="dn-bt" href="lesson.html?r=' + encodeURIComponent(r[1]) + '">'
        + '<span class="bt-when">' + esc(r[0]) + '</span>'
        + '<span class="bt-go">' + esc(open[r[1]]) + '　' + esc(r[2]) + ' →</span></a>';
    }).join('');
  }

  function render(d) {
    var gating = d.lessons.filter(function (x) { return x.gates; });
    var done = gating.filter(function (x) { return x.done; });
    var rest = gating.filter(function (x) { return !x.done; });

    if (rest.length) {
      /* まだ終わっていない人。責めずに、次に出すものだけを示す */
      var nextUp = rest[0];
      main.innerHTML =
        '<div class="lesson-head">'
        + '<div class="kicker">Curriculum</div>'
        + '<h1>まだ残っている回があります</h1>'
        + '<p class="aim">修了の画面は、提出を求める回をすべて出し終えると開きます。'
        + 'いまは' + done.length + ' / ' + gating.length + '回です。</p>'
        + '<div class="facts"><span><em>次に出すもの</em>'
        + esc(nextUp.label) + '　' + esc(nextUp.title) + '</span></div>'
        + '</div>'
        + '<p class="dn-back"><a class="deck-btn" href="lesson.html?r='
        + encodeURIComponent(nextUp.slug) + '">' + esc(nextUp.label) + 'へ</a>　'
        + '<a class="btn-text" href="lessons.html">資料の一覧に戻る</a></p>';
      return;
    }

    var rows = done.map(function (x) {
      return '<a class="dn-row" href="lesson.html?r=' + encodeURIComponent(x.slug) + '">'
        + '<span class="ln">' + esc(x.label) + '</span>'
        + '<span class="lt">' + esc(x.title) + '</span></a>';
    }).join('');

    main.innerHTML =
      '<div class="dn-head">'
      + '<div class="kicker">Complete</div>'
      + '<h1>' + (d.name ? esc(d.name) + 'さん、' : '') + '全' + gating.length + '回、出し切りました。</h1>'
      + '<p class="dn-lead">ここまでに出したものは、すべて手元に残っています。'
      + '<b>この講座で渡したのは答えではなく、問いの立て方でした。</b>'
      + '使えるかどうかは、これから自分で確かめてください。</p>'
      + '</div>'

      + '<section class="dn-sec">'
      + '<h2>これから、この型をどう使うか</h2>'
      + '<ol class="dn-next">'
      + '<li><b>第12回で作ったチェックリストを、月に一度見直す。</b>'
      + '使わなかった項目は消してください。手元に残すのは、自分が本当に使うものだけです。</li>'
      + '<li><b>ニュースを1本、問いに変える。</b>'
      + '<a href="topics.html">AI Topics</a>に、当社が選んだニュースと、そこから立てた問いを載せています。'
      + '同じことを自分でやるのが、いちばん軽い練習です。</li>'
      + '<li><b>詰まったら、また聞いてください。</b>'
      + '資料と質問欄は、修了後もそのまま開いたままにしてあります。'
      + 'オフィスアワーも、枠が空いていれば予約できます。</li>'
      + '</ol>'
      + '<p class="dn-hint">「月に一度」は、決めておかないと来ません。'
      + '<b>いま、来月の同じ日にカレンダーへ入れてください。</b>5分で終わります。</p>'
      + '</section>'

      /* 修了後にいちばん要るのは、励ましではなく索引。
         困った場面から、戻る回へ引けるようにする */
      + '<section class="dn-sec">'
      + '<h2>こういうときは、この回に戻る</h2>'
      + '<div class="dn-back-to">' + backTo(d) + '</div>'
      + '</section>'

      + '<section class="dn-sec">'
      + '<h2>出し切った回</h2>'
      + '<div class="dn-list">' + rows + '</div>'
      + '</section>'

      + '<p class="dn-back"><a class="btn-text" href="lessons.html">資料の一覧に戻る</a>　'
      + '<a class="btn-text" href="topics.html">AI Topics を見る</a></p>';
  }

  function start() {
    Course.api('/me').then(function (res) {
      if (!res.ok) {
        Course.setCode('');
        Course.askCode(main, render);
        return;
      }
      render(res.d);
    }).catch(function () {
      main.innerHTML = '<div class="lesson-head"><p class="aim">'
        + '読み込めませんでした。通信を確かめて、ページを再読み込みしてください。</p></div>';
    });
  }

  if (!Course.code()) Course.askCode(main, render);
  else start();
})();
</script>

</body>
</html>
