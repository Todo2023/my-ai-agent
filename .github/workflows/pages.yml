# todo_game/ を GitHub Pages に出して、スマホからアプリとして入れられるようにする。
# 初回だけリポジトリの Settings → Pages → Source を "GitHub Actions" にする必要がある。
name: Deploy todo_game to Pages

on:
  push:
    branches: [claude/new-game-project-vkjz3a, main]
    paths: ["todo_game/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Pages のソースが「ブランチ」のままでも、ここで Actions 方式に切り替える
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: todo_game
      - id: deploy
        uses: actions/deploy-pages@v4
