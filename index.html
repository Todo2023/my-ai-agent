<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>アプリ置き場</title>
<meta name="description" content="このサイトに置いてあるアプリの一覧。どれもインストール無料・アカウント不要。" />
<meta name="theme-color" content="#0d1020" />
<meta name="color-scheme" content="dark" />
<!--
  ここには manifest も Service Worker も置かない。
  直下にアプリを置くと担当範囲がサイト全体に広がり、
  下の階層のアプリのリンクまで横取りしてしまうため。
  アプリは1つずつフォルダに分けて、それぞれの中で完結させる。
-->
<style>
  :root { --bg: #0d1020; --text: #e8ecf8; --dim: #8d97b8; --line: rgba(232,236,248,0.12); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    padding: max(36px, env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
    background: radial-gradient(120% 70% at 50% -10%, #1b2240 0%, rgba(27,34,64,0) 60%), var(--bg);
    background-color: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 26px;
    -webkit-tap-highlight-color: transparent;
  }
  h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: 0.14em; }
  .lead { margin: -16px 0 0; font-size: 12.5px; line-height: 1.9; color: var(--dim); text-align: center; max-width: 24em; }
  ul { list-style: none; margin: 0; padding: 0; width: min(100%, 460px); display: flex; flex-direction: column; gap: 12px; }
  a.app {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px; border-radius: 16px;
    background: rgba(232,236,248,0.05); border: 1px solid var(--line);
    color: inherit; text-decoration: none;
  }
  a.app:active { background: rgba(232,236,248,0.09); }
  a.app img { width: 52px; height: 52px; border-radius: 13px; flex: 0 0 auto; }
  a.app .t { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  a.app .n { font-size: 15px; font-weight: 700; }
  a.app .d { font-size: 12px; line-height: 1.6; color: var(--dim); }
  footer { font-size: 11px; line-height: 1.9; color: rgba(141,151,184,0.7); text-align: center; max-width: 26em; }
</style>
</head>
<body>

<h1>アプリ置き場</h1>
<p class="lead">スマホのホーム画面に入れて使えます。<br />インストールは無料、アカウントも審査もありません。</p>

<ul>
  <li>
    <a class="app" href="meshi/">
      <img src="meshi/icon-192.png" alt="" width="52" height="52" />
      <span class="t">
        <span class="n">スクショ飯</span>
        <span class="d">行きたい店のスクショを貯めて、行ったらチェック</span>
      </span>
    </a>
  </li>
  <li>
    <a class="app" href="todo_game/">
      <img src="todo_game/icon-192.png" alt="" width="52" height="52" />
      <span class="t">
        <span class="n">トドの晩酌</span>
        <span class="d">回転レーンの皿を開けて、注文どおりの品を食べさせる</span>
      </span>
    </a>
  </li>
  <li>
    <a class="app" href="kakei/">
      <img src="kakei/icon-192.png" alt="" width="52" height="52" />
      <span class="t">
        <span class="n">家計のみらい</span>
        <span class="d">毎月の収支から、この先の残高を1本の線にする</span>
      </span>
    </a>
  </li>
  <li>
    <a class="app" href="breakout/">
      <img src="breakout/icon-192.png" alt="" width="52" height="52" />
      <span class="t">
        <span class="n">ブロック崩し</span>
        <span class="d">指でドラッグして遊ぶ、シンプルなブロック崩し</span>
      </span>
    </a>
  </li>
</ul>

<footer>どれも通信なしで動きます（保存も端末の中だけ）。<br />アプリごとにフォルダを分けてあるので、1つ入れても他の邪魔をしません。</footer>

</body>
</html>
