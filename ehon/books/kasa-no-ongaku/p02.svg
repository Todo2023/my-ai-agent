"569"/><line x1="1286" y1="284" x2="1272" y2="330"/><line x1="1156" y1="96" x2="1142" y2="142"/><line x1="306" y1="555" x2="292" y2="601"/><line x1="208" y1="223" x2="194" y2="269"/><line x1="1208" y1="181" x2="1194" y2="227"/><line x1="1160" y1="459" x2="1146" y2="505"/><line x1="1100" y1="29" x2="1086" y2="75"/><line x1="874" y1="175" x2="860" y2="221"/><line x1="888" y1="161" x2="874" y2="207"/><line x1="1403" y1="556" x2="1389" y2="602"/><line x1="288" y1="336" x2="274" y2="382"/><line x1="235" y1="304" x2="221" y2="350"/><line x1="117" y1="397" x2="103" y2="443"/><line x1="112" y1="66" x2="98" y2="112"/><line x1="531" y1="242" x2="517" y2="288"/><line x1="826" y1="669" x2="812" y2="715"/><line x1="202" y1="653" x2="188" y2="699"/></g><path d="M0 900 Q400 840 800 890 T1600 860 L1600 1000 L0 1000 Z" fill="#7f9a86"/>
