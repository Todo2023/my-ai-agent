<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>わんわん るーれっと — アプリとして入れる</title>
<meta name="description" content="ルーレットを回すと、止まったマスの動画が始まる幼児向けアプリ。ホーム画面に入れて使えます。">
<meta name="theme-color" content="#fff7ed">
<meta name="color-scheme" content="light">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="わんわん">
<meta property="og:title" content="わんわん るーれっと">
<meta property="og:description" content="ルーレットを回すと、止まったマスの動画が始まる幼児向けアプリ。">
<meta property="og:image" content="./icon-512.png">
<script>
  // ホーム画面のアイコンから開いたときは、案内を挟まずアプリへ
  if (matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) {
    location.replace("./app.html");
  }
</script>
<style>
  :root { --bg: #fff7ed; --ink: #4a3b2f; --pink: #ff8fab; --yellow: #ffd166; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 32px 20px calc(32px + env(safe-area-inset-bottom)); text-align: center;
  }
  /* アイコン画像は四角。この画面では円形に見せる（切り抜きはCSSで行う） */
  img.icon { width: 128px; height: 128px; border-radius: 50%; box-shadow: 0 8px 20px rgba(0,0,0,.2); }
  h1 { margin: 0; font-size: clamp(24px, 6vw, 34px); }
  p { margin: 0; max-width: 32em; line-height: 1.7; }
  .lead { font-size: clamp(15px, 4vw, 18px); }
  .btn {
    display: inline-block; padding: 16px 32px; border: none; border-radius: 999px;
    background: var(--pink); color: var(--ink); font: inherit; font-size: clamp(17px, 4.6vw, 21px);
    font-weight: 700; box-shadow: 0 6px 0 rgba(0,0,0,.18); cursor: pointer; text-decoration: none;
  }
  .btn:active { transform: translateY(4px); box-shadow: none; }
  .btn--sub { background: var(--yellow); }
  .steps {
    max-width: 32em; text-align: left; background: #fff; border-radius: 20px;
    padding: 20px 24px; box-shadow: 0 4px 0 rgba(0,0,0,.1); line-height: 1.8;
  }
  .steps h2 { margin: 0 0 8px; font-size: 17px; }
  .steps ol { margin: 0; padding-left: 1.3em; }
  .steps p { margin: 0; }
  .warn { background: #ffe9ec; box-shadow: 0 4px 0 rgba(224,82,99,.25); }
  .note { font-size: 13px; opacity: .7; max-width: 32em; }
  .hidden { display: none; }
</style>
</head>
<body>

<img class="icon" src="./icon-192.png" alt="">
<h1>わんわん るーれっと</h1>
<p class="lead">ルーレットを回すと、止まったマスの動画が始まります。<br>ホーム画面に入れると、全画面で使えます。</p>

<div id="inapp" class="steps warn hidden">
  <h2>まず Safari で開いてください</h2>
  <p>LINE などのアプリの中のブラウザからは、ホーム画面に追加できません。<br>
  画面の右上（または右下）の <b>…</b> や <b>矢印</b> のボタンから
  <b>「Safariで開く」</b>（Android は<b>「ブラウザで開く」</b>）を選んでください。</p>
</div>

<button id="installBtn" class="btn hidden">📲 アプリとして入れる</button>

<div id="steps" class="steps hidden">
  <h2 id="stepsTitle">ホーム画面に追加する</h2>
  <ol id="stepsList"></ol>
</div>

<a class="btn btn--sub" href="./app.html">▶ このまま はじめる</a>

<p class="note">動画は YouTube の無料動画を再生します（通信が必要です）。見守りタイマーは20分で、解除は大人の長押しです。</p>

<script>
  const installBtn = document.getElementById('installBtn');
  const steps = document.getElementById('steps');
  const stepsTitle = document.getElementById('stepsTitle');
  const stepsList = document.getElementById('stepsList');

  let deferred = null;

  // Android Chrome などはインストール用のイベントが来る
  addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferred = e;
    steps.classList.add('hidden');
    installBtn.classList.remove('hidden');
  });

  installBtn.addEventListener('click', async () => {
    if (!deferred) return;
    installBtn.disabled = true;
    deferred.prompt();
    await deferred.userChoice;
    deferred = null;
    installBtn.classList.add('hidden');
  });

  addEventListener('appinstalled', () => installBtn.classList.add('hidden'));

  // LINE などアプリ内ブラウザだと、そもそもホーム画面に追加できない
  const isInApp = /Line\/|FBAN|FBAV|Instagram|Twitter|MicroMessenger/.test(navigator.userAgent);
  if (isInApp) document.getElementById('inapp').classList.remove('hidden');

  // イベントが来ない端末（iPhone など）には、手順を文章で出す
  function showManualSteps() {
    if (!installBtn.classList.contains('hidden') || isInApp) return;
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const list = isIOS
      ? ['画面の下（または上）の <b>共有ボタン</b>（□に↑）を押す',
         '<b>「ホーム画面に追加」</b>を選ぶ',
         '右上の<b>「追加」</b>を押す']
      : ['ブラウザのメニュー（︙ など）を開く',
         '<b>「アプリをインストール」</b>または<b>「ホーム画面に追加」</b>を選ぶ',
         '確認を押す'];
    stepsTitle.textContent = isIOS ? 'iPhone・iPad（Safari）でホーム画面に追加' : 'ホーム画面に追加';
    stepsList.innerHTML = list.map((s) => '<li>' + s + '</li>').join('');
    steps.classList.remove('hidden');
  }

  // beforeinstallprompt が来るなら少し待てば来る
  setTimeout(showManualSteps, 1200);

  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
