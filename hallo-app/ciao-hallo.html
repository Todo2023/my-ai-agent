<title>Ciao Hallo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+Thai:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* レイアウト：上に固定ヘッダー（言語・現地と日本の日時＋国旗帯）、中央に1列の作業面、下に4タブ。旅行中に片手で使うスマホ前提 */
:root{
  --bg:#eef1ee; --surface:#ffffff; --ink:#17201b; --muted:#5b675f; --line:#d9dfda;
  --it:#14774a; --nl:#c4520a; --th:#2b48a8; --on-accent:#ffffff;
  --good:#1d7f47; --bad:#bf3324; --flag-w:#ffffff;
  --it-r:#c8312f; --nl-r:#b5242c; --nl-b:#21468b; --th-r:#b3243b; --th-b:#2d3a8c;
  --wx-sun:#c98a00; --wx-rain:#2f6db3;
  --f-display:"Bricolage Grotesque","Noto Sans Thai","Helvetica Neue",Arial,sans-serif;
  --f-body:"Zen Kaku Gothic New","Noto Sans Thai","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1a1f1c; --ink:#e8ede9; --muted:#97a39b; --line:#2b332e;
  --it:#43c483; --nl:#ff8b3e; --th:#8aa2ee; --on-accent:#0c110e; --good:#4fcf88; --bad:#ff6d5c; --flag-w:#d8ddd9;
  --it-r:#e0524f; --nl-r:#e0525a; --nl-b:#5b80cf; --th-r:#e0525a; --th-b:#6f86d8;
  --wx-sun:#f2b84b; --wx-rain:#79a9e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a1f1c; --ink:#e8ede9; --muted:#97a39b; --line:#2b332e;
  --it:#43c483; --nl:#ff8b3e; --th:#8aa2ee; --on-accent:#0c110e; --good:#4fcf88; --bad:#ff6d5c; --flag-w:#d8ddd9;
  --it-r:#e0524f; --nl-r:#e0525a; --nl-b:#5b80cf; --th-r:#e0525a; --th-b:#6f86d8;
  --wx-sun:#f2b84b; --wx-rain:#79a9e6; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  --accent:var(--it); --soft:color-mix(in srgb,var(--accent) 13%,var(--surface));
  --flag:linear-gradient(90deg,var(--it) 0 33.33%,var(--flag-w) 33.33% 66.66%,var(--it-r) 66.66%)}
body[data-lang="nl"]{--accent:var(--nl);--flag:linear-gradient(90deg,var(--nl-r) 0 33.33%,var(--flag-w) 33.33% 66.66%,var(--nl-b) 66.66%)}
body[data-lang="th"]{--accent:var(--th);--flag:linear-gradient(90deg,var(--th-r) 0 16.66%,var(--flag-w) 16.66% 33.33%,var(--th-b) 33.33% 66.66%,var(--flag-w) 66.66% 83.33%,var(--th-r) 83.33%)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-in{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:10px 8px;display:grid;gap:6px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em;line-height:1}
.brand b{color:var(--accent);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.meta{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.meta strong{color:var(--ink);font-weight:700}
.meta .clk{white-space:nowrap}
.offl{color:var(--bad);font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.flag{height:4px;background:var(--flag)}

main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.stack{display:grid;gap:14px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.hint{font-size:12.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip small{color:var(--muted);margin-left:4px;font-family:var(--f-mono);font-size:11px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
.field::placeholder{color:var(--muted)}
textarea.field{min-height:160px;line-height:1.6}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;line-height:1.3;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
a.btn{color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.big{padding:12px 18px;font-size:15px}
.btn.on{background:var(--soft);border-color:var(--accent)}
.btn.star[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}

.list{display:grid}
.ph{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:4px;min-width:0}
.ph:first-child{border-top:0}
.ph-ja{font-size:13.5px;color:var(--muted);font-weight:500}
.ph-fl{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.3;overflow-wrap:anywhere}
.ph-kana{font-size:13px;color:var(--accent);font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.note{margin:6px 0 0;padding:8px 12px;border-radius:10px;background:var(--soft);font-size:13.5px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.spk{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex:none}
.sayw{border:0;background:none;padding:0 1px;margin:0;font:inherit;font-weight:700;color:var(--accent);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.sayw .spk{width:13px;height:13px;margin-left:2px}

/* 地図 */
.mapframe{width:100%;aspect-ratio:4/3;max-width:100%;border:0;border-radius:14px;display:block;background:var(--line)}
.place{display:grid;gap:4px;padding:12px 16px;border-top:1px solid var(--line)}
.place:first-child{border-top:0}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:2px;color:var(--on-accent);background:var(--muted)}
.tag.it{background:var(--it)} .tag.nl{background:var(--nl)} .tag.th{background:var(--th)}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.form .full{grid-column:1/-1}

/* 時計 */
.city{display:grid;gap:8px;padding:14px 16px}
.city-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.city .t{font-family:var(--f-mono);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.city .d{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.city .diff{font-size:12px;color:var(--muted)}
.daychip{font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;margin-left:6px;background:var(--soft);color:var(--ink)}
.wx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
.wx svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wx .temp{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.wx .sun{color:var(--wx-sun)} .wx .rain{color:var(--wx-rain)} .wx .other{color:var(--muted)}
.fc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.fc div{font-size:12px;text-align:center;background:var(--bg);border-radius:8px;padding:4px 2px;line-height:1.35}
.fc svg{width:20px;height:20px;display:block;margin:2px auto}

/* 情報 */
.sos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sos .panel{padding:10px 14px;display:grid;gap:2px}
.sos .num{font-family:var(--f-mono);font-size:26px;font-weight:500;color:var(--bad);text-decoration:none;line-height:1.2}
.prow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.prow > div{min-width:0;flex:1 1 220px}
.state{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px}
.state.ok{color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.state.todo{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
a.link{color:var(--accent);font-weight:700;text-decoration:none}

/* 見せる（全画面） */
.show{position:fixed;inset:0;z-index:40;background:var(--surface);display:grid;place-items:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.show-in{max-width:720px;width:100%;display:grid;gap:18px;text-align:center}
.show-fl{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,9vw,62px);line-height:1.2;overflow-wrap:anywhere;margin:0}
.show-ja{font-size:16px;color:var(--muted);margin:0}
.show-lead{font-size:14px;color:var(--accent);font-weight:700;margin:0;letter-spacing:.04em}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:transparent;padding:9px 0 10px;font-size:11.5px;white-space:nowrap;color:var(--muted);display:grid;justify-items:center;gap:3px;font-weight:500}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;max-width:calc(100% - 32px)}
@media (max-width:420px){.ph-fl{font-size:21px}.city .t{font-size:30px}.seg button{padding:5px 9px}}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:background .15s,border-color .15s}}
</style>

</div>

<script>
/* ============================================================
   Ciao Hallo — 旅行中に必要な情報を1か所に集める（2026/11/9〜11/13）
   イタリア語・オランダ語・タイ語の頻出フレーズ、Googleマップ、各地の時計と天気、緊急連絡先とメモ。
   学習（レッスン・カード・クイズ）は旅行直前に廃止した。旅行中は「すぐ探せて、聞けて、見せられる」ことだけを優先する。
   フレーズ1件 = [id, 日本語, 伊, 伊カナ, 蘭, 蘭カナ, 泰, 泰カナ]
   タイ語の {p}（平叙）{q}（疑問）は丁寧の語尾。話す人の性別で ครับ（男性）／ค่ะ・คะ（女性）に置き換える。
   カタカナは発音の目安。
   ============================================================ */
const CATS=[["g","あいさつ"],["e","基本"],["n","数字"],["m","買い物・お金"],["r","レストラン"],["t","交通・道"],["h","ホテル"],["a","空港"],["x","緊急"]];
const P=[
["g1","こんにちは","Buongiorno","ボンジョルノ","Hallo","ハロー","สวัสดี{p}","サワッディー{p}"],

["g3","すみません（呼びかけ）","Scusi","スクーズィ","Pardon","パルドン","ขอโทษ{p}","コートート{p}"],
["g4","ごめんなさい","Mi dispiace","ミ ディスピアーチェ","Sorry","ソリー","ขอโทษ{p}","コートート{p}"],

["g6","さようなら","Arrivederci","アッリヴェデルチ","Tot ziens","トット ズィーンス","ลาก่อน{p}","ラーコーン{p}"],
["g7","大丈夫です／気にしないで","Va bene","ヴァ ベーネ","Geen probleem","ヘーン プロブレーム","ไม่เป็นไร{p}","マイペンライ{p}"],
["g8","結構です（断る）","No, grazie","ノ グラツィエ","Nee, dank je","ネー ダンク ヤ","ไม่เอา{p}","マイアオ{p}"],

["e1","英語を話せますか？","Parla inglese?","パルラ イングレーゼ？","Spreekt u Engels?","スプレークト ユー エンゲルス？","พูดภาษาอังกฤษได้ไหม{q}","プート パーサー アンカリット ダイマイ{q}？"],
["e2","わかりません","Non capisco","ノン カピスコ","Ik begrijp het niet","イック ベフライプ ヘット ニート","ไม่เข้าใจ{p}","マイ カオチャイ{p}"],
["e3","ゆっくり話してください","Più lentamente, per favore","ピュウ レンタメンテ ペル ファヴォーレ","Langzamer, alstublieft","ランフザーメル アルステュブリーフト","พูดช้าๆ หน่อย{p}","プート チャーチャー ノイ{p}"],
["e4","〜はどこですか？","Dov'è ...?","ドヴェ …？","Waar is ...?","ヴァール イス …？","...อยู่ที่ไหน{q}","… ユー ティーナイ{q}？"],
["e5","トイレはどこですか？","Dov'è il bagno?","ドヴェ イル バーニョ？","Waar is het toilet?","ヴァール イス ヘット トワレット？","ห้องน้ำอยู่ที่ไหน{q}","ホンナーム ユー ティーナイ{q}？"],

["e8","〜をください","Vorrei ...","ヴォッレイ …","Ik wil graag ...","イック ヴィル ハラーハ …","ขอ...{p}","コー …{p}"],

/* ---------- 写真から読む（OCR） ----------
   メニューや看板を撮って文字を読み取り、1行ずつ日本語にする。

   以後は端末に残るので通信なしでも読める（Service Worker と Tesseract 自身の保存）。日本語への翻訳は通信が必要。

const OCR_LANGS={it:["イタリア語","ita"],nl:["オランダ語","nld"],th:["タイ語","tha"],en:["英語","eng"]};

function loadTesseract(){
  if(window.Tesseract)return Promise.resolve();

function progLabel(m){
  if(m.status==="recognizing text")return "読み取り中… "+Math.round((m.progress||0)*100)+"%";

  return "準備中…";

function paintOcrProg(){const e=$("#ocrProg");if(e)e.textContent=U.ocr.prog}
async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{const img=new Image();await new Promise((ok,ng)=>{img.onload=ok;img.onerror=ng;img.src=url});
    const k=Math.min(1,2000/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);

async function runOcr(file){
  if(isArtifact()){U.ocr.err="claude.ai 版では使えません。ホーム画面版で開いてください。";paintTrans();return}
  const ol=ocrLang();
  U.ocr={...U.ocr,busy:true,err:"",prog:"準備中…",lines:[],img:""};paintTrans();
  try{
    await loadTesseract();
    const c=await shrinkImage(file);U.ocr.img=c.toDataURL("image/jpeg",0.6);paintTrans();

/* 読み取り用データを先に取り込んでおく（Wi-Fi のうちに）。一度取り込めば通信なしでも読める */
async function ocrPrepare(){

      if(l.ja)return;
      try{const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(l.src.slice(0,450))+"&langpair="+ol+"|ja");

        <span>${esc(ic.t)}${td?`<br><span class="hint">最高 ${Math.round(td.hi)}° / 最低 ${Math.round(td.lo)}°</span>`:""}</span>
        ${w.d&&w.d.length>1?`<div class="fc">${w.d.slice(1,4).map(f=>{const fi=wxIcon(f.c,1);const[y,m,d]=f.d.split("-").map(Number);
          return `<div>${m}/${d}(${WD[new Date(Date.UTC(y,m-1,d)).getUTCDay()]})${fi.svg}${Math.round(f.hi)}° / ${Math.round(f.lo)}°</div>`}).join("")}</div>`:""}
      </div>`}
    return `<div class="panel city">
      <div class="city-top">
        <div><b style="font-size:17px">${esc(c.name)}</b> <span class="hint">${esc(c.sub)}</span>
          <div class="d">${mdw(c.tz,now)}${chip?`<span class="daychip">${chip}</span>`:""}</div>
          ${dl?`<div class="diff">${dl}</div>`:""}</div>
        <div class="t">${hm(c.tz,now)}</div>
      </div>${wx}</div>`;
  }).join("");
  return head+cards+`<p class="hint" style="margin:0">夏時間は自動で反映します。気温は摂氏。天気：Open-Meteo</p>`;
}
function viewClock(){return `<div class="stack" id="clockview">${clockInner()}</div>`}
function paintClock(){const el=$("#clockview");if(el)el.innerHTML=clockInner()}

/* ---------- 情報（緊急連絡先・メモ・通信なしの準備） ---------- */
const SOS=[
  ["イタリア","112","警察・救急・消防（共通）"],
  ["オランダ","112","警察・救急・消防（共通）"],
  ["タイ","191","警察"],["タイ","1669","救急"],["タイ","1155","観光警察（英語可）"],
  ["香港","999","警察・救急・消防"],
  ["日本","110 / 119","警察 / 救急・消防"]
];
const PWA_URL="https://todo2023.github.io/my-ai-agent/hallo-app/";
async function checkPrep(){
  let app;
  if(isArtifact())app="artifact";
  else if(!("serviceWorker" in navigator)||!window.caches)app="unsupported";
  else{try{const reg=await navigator.serviceWorker.getRegistration();
    const hit=await caches.match("index.html",{ignoreSearch:true});
    app=reg&&reg.active&&hit?"ok":"no"}catch(e){app="no"}}
  U.prep.app=app;paintPrep();
}
function voiceState(l){
  if(!("speechSynthesis" in window))return"none";
  return speechSynthesis.getVoices().some(v=>v.lang.replace("_","-").toLowerCase().startsWith(l))?"ok":"none";
}
function prepRows(){
  const pill=(ok,txt)=>`<span class="state ${ok?"ok":"todo"}">${txt}</span>`;
  const a=U.prep.app;
  const appRow=a==="ok"?[true,"保存済み","通信なしでも開けます。"]
    :a==="checking"?[false,"確認中","…"]
    :a==="artifact"?[false,"この画面は不可",`claude.ai 版は通信なしでは開けません。ホーム画面版（<a class="link" href="${PWA_URL}" target="_blank" rel="noopener">${PWA_URL.replace("https://","")}</a>）を使ってください。`]
    :a==="unsupported"?[false,"非対応","Chrome（iPhoneはSafari）で開いてください。"]
    :[false,"まだ","通信のある場所で、このアプリを一度閉じてから開き直してください。"];
  const sample={it:"Buongiorno, grazie mille",nl:"Goedemorgen, dank je wel",th:"สวัสดีค่ะ ขอบคุณค่ะ"};
  const vrow=l=>{const ok=voiceState(l)==="ok";
    return `<div class="prow"><div><b>${esc(L[l].name)}の音声</b> ${pill(ok,ok?"あり":"見つからない")}
      <div class="hint">${ok?"機内モードで「試しに聞く」が鳴れば、通信なしでも大丈夫。":"端末に音声データが入っていません。下の手順で入れてください。"}</div></div>
      <button class="btn" data-act="sayt" data-t="${esc(sample[l])}" data-l="${l}">${SPK} 試しに聞く</button></div>`};
  return `<div class="eyebrow">通信なしで使う準備</div>
    <div class="prow"><div><b>アプリ本体</b> ${pill(appRow[0],appRow[1])}<div class="hint">${appRow[2]}</div></div></div>
    ${vrow("it")}${vrow("nl")}${vrow("th")}
    <details><summary class="hint" style="cursor:pointer">音声が鳴らないときの直し方（音声データを端末に入れる）</summary>
      <div class="hint" style="margin-top:6px;display:grid;gap:6px">
        <div><b>Android：</b>設定 → システム → 言語と入力 → 音声出力（テキスト読み上げ）→「Google 音声サービス」の歯車 → 音声データをインストール → イタリア語・オランダ語・タイ語をダウンロード（Wi-Fiで）</div>
        <div><b>iPhone：</b>設定 → アクセシビリティ → 読み上げコンテンツ → 声 → 各言語の声をダウンロード</div>
      </div></details>
    <div class="hint">地図は通信が必要です。Google マップのアプリで、ミラノ・アムステルダムなど行く街の「オフラインマップ」を先にダウンロードしておくと、通信なしでも地図と経路が見られます。</div>`;
}
function paintPrep(){const el=$("#prep");if(el)el.innerHTML=prepRows()}
function viewInfo(){
  return `<div class="stack">
    <div><div class="eyebrow" style="margin-bottom:6px">緊急番号（タップで電話）</div>
      <div class="sos">${SOS.map(([c,n,d])=>`<div class="panel"><span class="hint">${esc(c)}</span>
        <a class="num" href="tel:${esc(n.split(" ")[0])}">${esc(n)}</a><span class="hint">${esc(d)}</span></div>`).join("")}</div>
      <p class="hint" style="margin:8px 0 0">パスポートの紛失などは、日本の大使館・総領事館へ。連絡先は外務省の<a class="link" href="https://www.mofa.go.jp/mofaj/annai/zaigai/list/index.html" target="_blank" rel="noopener">在外公館リスト</a>で確認できます（通信が必要なので、必要な番号は下のメモに控えておくと安心）。</p>
    </div>
    <div class="panel pad stack" style="gap:8px">
      <label class="eyebrow" for="memo">旅行メモ（この端末だけに保存）</label>
      <textarea class="field" id="memo" placeholder="例：便名と出発時刻、ホテルの住所と電話、予約番号、カード会社の紛失時の電話、大使館の番号など">${esc(S.memo)}</textarea>
      <div class="hint">入力すると自動で保存されます。通信なしでも見られます。</div>
    </div>
    <div class="panel pad stack" id="prep">${prepRows()}</div>
  </div>`;
}

/* ---------- 描画とイベント ---------- */
function render(){
  renderChrome();
  const v=$("#view");
  v.innerHTML=U.tab==="phrase"?viewPhrase():U.tab==="trans"?viewTrans():U.tab==="map"?viewMap():U.tab==="clock"?viewClock():viewInfo();
  if(U.tab==="phrase")renderList();
  if(U.tab==="clock")fetchWeather(false);
  if(U.tab==="info")checkPrep();
}
function refreshRows(){if(U.tab==="phrase")renderList();else render()}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  switch(a){
    case"tab":U.tab=v;render();window.scrollTo(0,0);break;
    case"lang":if(S.lang!==v){S.lang=v;U.mapCity=null;save();render()}break;
    case"gender":S.gender=v;save();render();break;
    case"cat":U.cat=v;render();break;
    case"numsay":{const w=numWords(U.num,S.lang);if(w)speak(w.t,!!b.dataset.slow);break}
    case"numshow":{const w=numWords(U.num,S.lang);if(w)openShow(L[S.lang].name,w.t,Number(U.num).toLocaleString("ja-JP"),S.lang,w.t);break}
    case"favonly":U.favOnly=!U.favOnly;render();break;
    case"say":speak(fl(BY[id]),false);break;
    case"slow":speak(fl(BY[id]),true);break;
    case"sayt":speak(b.dataset.t,!!b.dataset.slow,TTS[b.dataset.l]?b.dataset.l:S.lang);break;
    case"show":{const p=BY[id];openShow(S.lang==="th"?politeTh(L.th.hey):L[S.lang].hey,fl(p),p[1]+"　/　"+kana(p),S.lang);break}
    case"addrshow":openShow("この場所に行きたいです / I want to go here",b.dataset.q,b.dataset.n,"",b.dataset.q);break;
    case"show-say":if(U.show&&U.show.lang)speak(U.show.t,true,U.show.lang);break;
    case"show-close":$("#show").hidden=true;U.show=null;break;
    case"fav":{if(S.fav[id])delete S.fav[id];else S.fav[id]=1;save();refreshRows();break}
    case"note":U.open[id]=!U.open[id];refreshRows();break;
    case"city":U.mapCity=v;S.mapQ="";save();render();break;
    case"mapshow":S.mapQ=b.dataset.q;save();render();window.scrollTo(0,0);break;
    case"pdel":{const i=+b.dataset.i;if(S.places[i]){S.places.splice(i,1);save();render();toast("削除しました")}break}
    case"wxreload":fetchWeather(true);break;
    case"trfrom":S.tr.from=v;save();paintTrans();break;
    case"trto":S.tr.to=v;save();paintTrans();break;
    case"trgo":translateNow();break;
    case"trshow":openShow(TRL[b.dataset.l],b.dataset.t,b.dataset.s,b.dataset.l,b.dataset.t);break;
    case"trclear":S.tr.hist=[];save();paintTrans();break;
    case"trmode":U.trMode=v;paintTrans();break;
    case"ocrlang":U.ocr.lang=v;U.ocr.lines.forEach(l=>l.ja="");paintTrans();break;
    case"ocrja":ocrTranslate();break;
    case"ocrprep":ocrPrepare();break;
    case"copy":{const t=b.dataset.t;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast("コピーしました"),()=>toast("コピーできませんでした"));else toast("コピーできませんでした");break}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#show").hidden){$("#show").hidden=true;U.show=null}});
let memoT;
document.addEventListener("input",e=>{
  if(e.target.id==="q"){U.q=e.target.value;renderList()}
  if(e.target.id==="numIn"){U.num=e.target.value.replace(/[^0-9]/g,"").slice(0,6);const o=$("#numOut");if(o)o.innerHTML=numOut()}
  if(e.target.id==="trIn"){U.trIn=e.target.value;const a=document.querySelector('#transview a[href*="translate.google"]');if(a)a.href=gTrans(U.trIn.trim(),S.tr.from,S.tr.to)}
  if(e.target.id==="memo"){S.memo=e.target.value;clearTimeout(memoT);memoT=setTimeout(save,300)}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if((t.id==="ocrCam"||t.id==="ocrPick")&&t.files&&t.files[0]){const f=t.files[0];t.value="";runOcr(f)}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="placeForm")return;e.preventDefault();
  const g=id=>($("#"+id).value||"").trim();
  const name=g("p-name"),q=g("p-q");if(!name||!q)return;
  S.places.push({city:defaultCity(),name,q,note:g("p-note")});S.mapQ=q;save();render();toast("登録しました");
});

/* 通信なし対応：初回に読み込んだフォントは Service Worker を通っていないので、ここで保存しておく */
function warmFonts(){
  if(isArtifact()||!window.caches||!("serviceWorker" in navigator))return;
  navigator.serviceWorker.ready.then(()=>caches.keys()).then(ks=>{
    const k=ks.find(x=>x.startsWith("hallo-app"));if(!k)return;
    return caches.open(k).then(c=>Promise.all(performance.getEntriesByType("resource").map(e=>e.name)
      .filter(u=>/^https:\/\/fonts\.(googleapis|gstatic)\.com\//.test(u))
      .map(u=>c.match(u).then(h=>h||fetch(u,{mode:"cors"}).then(r=>{if(r.ok)return c.put(u,r)}).catch(()=>{})))));
  }).then(checkPrep).catch(()=>{});
}
if("speechSynthesis" in window&&speechSynthesis.addEventListener)speechSynthesis.addEventListener("voiceschanged",paintPrep);
addEventListener("online",()=>{renderMeta();if(U.tab==="clock")fetchWeather(false)});
addEventListener("offline",renderMeta);
addEventListener("load",()=>{setTimeout(warmFonts,2500)});

render();
setInterval(()=>{renderMeta();if(U.tab==="clock")paintClock()},15000);
</script>
