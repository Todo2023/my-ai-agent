# todo_game/ を GitHub Pages に出して、スマホからアプリとして入れられるようにする。
# 初回だけリポジトリの Settings → Pages → Source を "GitHub Actions" にする必要がある。
name: Deploy todo_game to Pages

# 既定ブランチ以外からは github-pages 環境に配信できず必ず失敗するので、
# 自動起動はしない。配信先が決まったら手動で回すか、main に載せる。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Pages のソースが「ブランチ」のままでも、ここで Actions 方式に切り替える
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: todo_game
      - id: deploy
        uses: actions/deploy-pages@v4
