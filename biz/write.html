<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>書く | ハタラク文庫（仮）</title>
<meta name="theme-color" content="#0f766e" />
<meta name="color-scheme" content="light dark" />
<meta name="robots" content="noindex" /><!-- 投稿画面。公開後もこの行は外さない -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M8 9h16M8 16h16M8 23h10' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="editing">

<div class="demo-bar">
  <b>招待された人だけが書けます。</b>下書きは<b>この端末の中だけ</b>に残ります。「審査に出す」を押したときだけ送られます。
</div>

<header>
  <div class="wrap bar">
    <a class="logo" href="./">ハタラク文庫<small>KARI · WORKING LIBRARY</small></a>
    <nav>
      <a href="./">記事一覧</a>
      <a href="profile.html">自分の欄</a>
    </nav>
  </div>
</header>

<main class="wrap editor">

  <div class="drafts">
    <label for="draft-pick">下書き</label>
    <select id="draft-pick"></select>
    <button class="btn" id="new" type="button">あたらしく書く</button>
    <button class="btn danger" id="delete" type="button">この下書きを消す</button>
    <span class="saved" id="saved"></span>
  </div>

  <details class="meta-box" id="meta-box" open>
    <summary>記事の情報</summary>
    <div class="fields">
      <p class="f wide">
        <label for="f-title">タイトル<b>必須</b></label>
        <input id="f-title" type="text" maxlength="120" placeholder="問い合わせに繋がらないSEO記事に共通する3つの型" />
      </p>
      <p class="f">
        <label for="f-slug">ファイル名<b>必須</b></label>
        <input id="f-slug" type="text" maxlength="80" placeholder="seo-toiawase" spellcheck="false" />
        <span class="hint">半角の英数字と <code>-</code> だけ。URLになる</span>
      </p>
      <p class="f">
        <label for="f-emoji">絵文字</label>
        <input id="f-emoji" type="text" maxlength="4" placeholder="🔍" />
      </p>
      <p class="f">
        <label for="f-author">書き手</label>
        <input id="f-author" type="text" maxlength="40" placeholder="名前" />
      </p>
      <p class="f">
        <label for="f-date">公開日<b>必須</b></label>
        <input id="f-date" type="date" />
      </p>
      <p class="f wide">
        <label for="f-topics">トピック</label>
        <input id="f-topics" type="text" maxlength="120" placeholder="SEO, コンテンツ" />
        <span class="hint">読点ではなくカンマで区切る。<span id="topic-suggest"></span></span>
      </p>
      <p class="f wide check">
        <label><input id="f-pr" type="checkbox" /> 広告・案件記事（PR）</label>
        <span class="hint">お金や物を受け取って書いたものは<b>必ず付ける</b>。景表法のステマ規制の対象</span>
      </p>
    </div>
  </details>

  <p class="problems" id="problems" hidden></p>

  <div class="tabs" id="tabs">
    <button class="tab" id="tab-write" type="button" aria-pressed="true">書く</button>
    <button class="tab" id="tab-preview" type="button" aria-pressed="false">見る</button>
  </div>

  <div class="panes" id="panes">
    <div class="pane pane-write">
      <div class="toolbar">
        <button class="btn" type="button" data-wrap="**|**">太字</button>
        <button class="btn" type="button" data-line="## ">見出し</button>
        <button class="btn" type="button" data-line="- ">箇条書き</button>
        <button class="btn" type="button" data-block="| A | B |&#10;| --- | --- |&#10;| 1 | 2 |">表</button>
        <button class="btn" type="button" data-wrap="[|](https://)">リンク</button>
        <button class="btn" type="button" data-block=":::message&#10;&#10;:::">囲み</button>
        <span class="count" id="chars"></span>
      </div>
      <label class="skip" for="src">本文</label>
      <textarea id="src" spellcheck="false" placeholder="本文をMarkdownで書く。書き方は README にある。"></textarea>
    </div>

    <div class="pane pane-preview">
      <article class="body" id="preview"></article>
    </div>
  </div>

  <div class="send" id="send-box">
    <p class="send-state" id="send-state"></p>
    <div class="send-row" id="send-row" hidden>
      <label class="skip" for="email">メールアドレス</label>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" />
      <button class="btn" id="login" type="button">ログインのリンクを送る</button>
      <button class="btn primary" id="submit" type="button" hidden>審査に出す</button>
      <button class="btn" id="logout" type="button" hidden>ログアウト</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="download" type="button">.md をダウンロード</button>
    <button class="btn" id="copy" type="button">全文をコピー</button>
    <span class="hint" id="howto">
      落とした <code>.md</code> を <code>biz/articles/</code> に置いて
      <code>node biz/tools/build-index.mjs</code> を走らせると記事になります。
    </span>
  </div>

</main>

<script src="config.js"></script>
<script type="module" src="write.js"></script>
</body>
</html>
