<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1020">
<meta name="description" content="指でドラッグして遊ぶブロック崩し。HTML1枚・インストール不要。">
<title>ブロック崩し</title>

<!-- ホーム画面に追加したときにアプリのように全画面で開くための指定 -->
<link rel="manifest" href="../manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ブロック崩し">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">

<!-- リンクを共有したときのプレビュー -->
<meta property="og:title" content="ブロック崩し">
<meta property="og:description" content="指でドラッグして遊ぶブロック崩し。HTML1枚・インストール不要。">
<meta property="og:type" content="website">
<meta property="og:image" content="icon-512.png">
<style>
  :root {
    --bg: #0d1020;
    --fg: #e8ecff;
    --accent: #4dc3ff;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    /* スマホでのスクロール・ピンチ・長押しメニューを止める */
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #hud {
    position: absolute;
    top: calc(var(--safe-top) + 10px);
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 16px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    pointer-events: none;
  }

  #hud .label {
    opacity: 0.55;
    font-size: 10px;
    display: block;
    font-weight: 600;
  }

  #lives { letter-spacing: 2px; color: #ff5f6d; }

  #sound {
    pointer-events: auto;
    border: 0;
    background: rgba(255, 255, 255, 0.08);
    color: var(--fg);
    font-size: 16px;
    line-height: 1;
    width: 34px;
    height: 34px;
    border-radius: 10px;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
    text-align: center;
    background: rgba(13, 16, 32, 0.72);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }

  #overlay[hidden] { display: none; }

  #ovTitle {
    margin: 0;
    font-size: 28px;
    letter-spacing: 0.06em;
  }

  #ovText {
    margin: 0;
    font-size: 15px;
    line-height: 1.7;
    opacity: 0.85;
  }

  #ovHint {
    margin: 0;
    font-size: 12px;
    opacity: 0.5;
    animation: blink 1.6s ease-in-out infinite;
  }

  @keyframes blink { 50% { opacity: 0.15; } }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud">
      <div><span class="label">SCORE</span><span id="score">0</span></div>
      <div><span class="label">LEVEL</span><span id="level">1</span></div>
      <div><span class="label">BEST</span><span id="best">0</span></div>
      <div><span class="label">LIFE</span><span id="lives">♥♥♥</span></div>
      <button id="sound" type="button" aria-label="サウンド切り替え">🔊</button>
    </div>

    <div id="overlay">
      <h1 id="ovTitle">ブロック崩し</h1>
      <p id="ovText">指でドラッグしてパドルを動かそう</p>
      <p id="ovHint">画面をタップしてスタート</p>
    </div>
  </div>

<script>
(() => {
  'use strict';

  const stage   = document.getElementById('stage');
  const canvas  = document.getElementById('game');
  const ctx     = canvas.getContext('2d');
  const ui = {
    score:   document.getElementById('score'),
    level:   document.getElementById('level'),
    best:    document.getElementById('best'),
    lives:   document.getElementById('lives'),
    sound:   document.getElementById('sound'),
    overlay: document.getElementById('overlay'),
    title:   document.getElementById('ovTitle'),
    text:    document.getElementById('ovText'),
    hint:    document.getElementById('ovHint'),
  };

  const COLS = 7;
  const BASE_ROWS = 5;
  const MAX_ROWS = 8;
  const START_LIVES = 3;
  const ROW_COLORS = ['#ff5f6d', '#ffa63d', '#ffd93d', '#6bd968', '#4dc3ff', '#a78bfa', '#f472b6', '#34d399'];

  // 'ready'（球がパドル上・タップ待ち） / 'play' / 'over'
  let scene = 'ready';
  let score = 0, level = 1, lives = START_LIVES;
  let best = Number(localStorage.getItem('breakout.best') || 0);

  const view   = { w: 0, h: 0 };
  const paddle = { x: 0, y: 0, w: 0, h: 0, targetX: 0 };
  const ball   = { x: 0, y: 0, r: 0, vx: 0, vy: 0 };
  const geom   = { padX: 0, top: 0, gap: 0, bw: 0, bh: 0 };
  let bricks = [];
  let particles = [];

  const clamp = (v, min, max) => v < min ? min : v > max ? max : v;

  /* ---------- サイズ・レイアウト ---------- */

  function resize() {
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);

    // 画面が変わっても球とパドルの相対位置を保つ
    const rx = view.w ? ball.x / view.w : 0.5;
    const ry = view.h ? ball.y / view.h : 0.8;
    const px = view.w ? paddle.x / view.w : 0.5;

    view.w = w;
    view.h = h;
    canvas.width  = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    layout();

    ball.x = rx * w;
    ball.y = ry * h;
    paddle.x = clamp(px * w, paddle.w / 2, w - paddle.w / 2);
    paddle.targetX = paddle.x;
    if (scene === 'ready') restBallOnPaddle();
    draw();
  }

  // 画面サイズから各パーツの大きさを決める（すべて相対値なので端末を選ばない）
  function layout() {
    const { w, h } = view;

    geom.padX = w * 0.03;
    geom.gap  = w * 0.014;
    geom.top  = h * 0.12;
    geom.bw   = (w - geom.padX * 2 - geom.gap * (COLS - 1)) / COLS;
    geom.bh   = Math.max(geom.bw * 0.42, h * 0.022);

    paddle.w = w * 0.26;
    paddle.h = Math.max(h * 0.014, 10);
    // 下端から少し浮かせて、パドルが親指で隠れないようにする
    paddle.y = h - h * 0.16;

    ball.r = Math.max(w * 0.019, 6);
  }

  function brickRect(b) {
    return {
      x: geom.padX + b.col * (geom.bw + geom.gap),
      y: geom.top  + b.row * (geom.bh + geom.gap * 1.4),
      w: geom.bw,
      h: geom.bh,
    };
  }

  /* ---------- ゲームの組み立て ---------- */

  function buildBricks() {
    const rows = Math.min(BASE_ROWS + (level - 1), MAX_ROWS);
    // レベルが上がると上段は2回当てないと壊れない
    const toughRows = clamp(level - 1, 0, 2);
    bricks = [];
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < COLS; col++) {
        bricks.push({
          row, col,
          hp: row < toughRows ? 2 : 1,
          color: ROW_COLORS[row % ROW_COLORS.length],
        });
      }
    }
  }

  function ballSpeed() {
    return Math.min(view.h * 0.62 * (1 + (level - 1) * 0.1), view.h * 1.15);
  }

  function restBallOnPaddle() {
    ball.x = paddle.x;
    ball.y = paddle.y - paddle.h / 2 - ball.r - 1;
    ball.vx = 0;
    ball.vy = 0;
  }

  function launchBall() {
    const speed = ballSpeed();
    // 真上すぎると単調なので ±20〜45度のあいだで打ち出す
    const angle = (0.35 + Math.random() * 0.45) * (Math.random() < 0.5 ? -1 : 1);
    ball.vx = Math.sin(angle) * speed;
    ball.vy = -Math.cos(angle) * speed;
    scene = 'play';
    hideOverlay();
    beep(660, 0.05);
  }

  function resetGame() {
    score = 0;
    level = 1;
    lives = START_LIVES;
    particles = [];
    startLevel();
  }

  function startLevel() {
    buildBricks();
    layout();
    paddle.x = paddle.targetX = view.w / 2;
    restBallOnPaddle();
    scene = 'ready';
    syncHud();
  }

  /* ---------- 更新 ---------- */

  function update(dt) {
    // パドルは指の位置へ滑らかに追従
    paddle.x += (paddle.targetX - paddle.x) * Math.min(1, dt * 22);
    paddle.x = clamp(paddle.x, paddle.w / 2, view.w - paddle.w / 2);

    updateParticles(dt);

    if (scene !== 'play') {
      if (scene === 'ready') restBallOnPaddle();
      return;
    }

    // 1フレームの移動量が大きいとブロックをすり抜けるので細かく刻む
    const dist = Math.hypot(ball.vx, ball.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / (ball.r * 0.5)));
    for (let i = 0; i < steps; i++) {
      if (!stepBall(dt / steps)) return; // ミス処理に入ったら以降は進めない
    }

    if (bricks.length === 0) clearLevel();
  }

  function stepBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // 壁
    if (ball.x - ball.r < 0)        { ball.x = ball.r;             ball.vx = Math.abs(ball.vx);  beep(440, 0.03); }
    if (ball.x + ball.r > view.w)   { ball.x = view.w - ball.r;    ball.vx = -Math.abs(ball.vx); beep(440, 0.03); }
    if (ball.y - ball.r < 0)        { ball.y = ball.r;             ball.vy = Math.abs(ball.vy);  beep(440, 0.03); }

    hitPaddle();
    hitBricks();

    // 下に落ちた
    if (ball.y - ball.r > view.h) {
      loseLife();
      return false;
    }
    return true;
  }

  function hitPaddle() {
    if (ball.vy <= 0) return;
    const r = { x: paddle.x - paddle.w / 2, y: paddle.y - paddle.h / 2, w: paddle.w, h: paddle.h };
    if (!circleHitsRect(ball, r)) return;

    // 当たった位置で跳ね返る角度を変える（端ほど鋭角）
    const offset = clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1);
    const angle = offset * 1.05; // 最大 ±60度
    const speed = Math.max(Math.hypot(ball.vx, ball.vy), ballSpeed());
    ball.vx = Math.sin(angle) * speed;
    ball.vy = -Math.cos(angle) * speed;
    ball.y = r.y - ball.r - 0.5;
    beep(520, 0.05);
  }

  function hitBricks() {
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      const r = brickRect(b);
      if (!circleHitsRect(ball, r)) continue;

      // めり込みが浅い軸のほうで跳ね返す
      const ox = (r.w / 2 + ball.r) - Math.abs(ball.x - (r.x + r.w / 2));
      const oy = (r.h / 2 + ball.r) - Math.abs(ball.y - (r.y + r.h / 2));
      if (ox < oy) {
        ball.vx = -ball.vx;
        ball.x += Math.sign(ball.x - (r.x + r.w / 2)) * ox;
      } else {
        ball.vy = -ball.vy;
        ball.y += Math.sign(ball.y - (r.y + r.h / 2)) * oy;
      }

      b.hp -= 1;
      if (b.hp > 0) {
        spawnParticles(r.x + r.w / 2, r.y + r.h / 2, b.color, 4);
        beep(300, 0.04);
      } else {
        bricks.splice(i, 1);
        spawnParticles(r.x + r.w / 2, r.y + r.h / 2, b.color, 12);
        addScore((BASE_ROWS - Math.min(b.row, BASE_ROWS - 1)) * 10);
        beep(760 + b.row * 40, 0.05);
      }
      return; // 1ステップにつき1個まで
    }
  }

  function circleHitsRect(c, r) {
    const nx = clamp(c.x, r.x, r.x + r.w);
    const ny = clamp(c.y, r.y, r.y + r.h);
    const dx = c.x - nx, dy = c.y - ny;
    return dx * dx + dy * dy <= c.r * c.r;
  }

  function addScore(points) {
    score += points;
    if (score > best) {
      best = score;
      localStorage.setItem('breakout.best', String(best));
    }
    syncHud();
  }

  function loseLife() {
    lives -= 1;
    syncHud();
    beep(180, 0.25, 'sawtooth');
    if (lives <= 0) {
      scene = 'over';
      showOverlay('ゲームオーバー', `スコア ${score} ／ ベスト ${best}`, 'タップでもう一度');
    } else {
      scene = 'ready';
      restBallOnPaddle();
      showOverlay('ミス！', `残り ${lives} 機`, 'タップして再開');
    }
  }

  function clearLevel() {
    level += 1;
    addScore(100 * (level - 1));
    startLevel();
    showOverlay('レベルクリア！', `つぎは LEVEL ${level}`, 'タップして続ける');
    beep(880, 0.12);
  }

  /* ---------- 破片エフェクト ---------- */

  function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = (0.15 + Math.random() * 0.35) * view.h;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color });
    }
    if (particles.length > 240) particles.splice(0, particles.length - 240);
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += view.h * 1.2 * dt; // 重力
      p.life -= dt * 2.2;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  /* ---------- 描画 ---------- */

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
    ctx.fill();
  }

  function draw() {
    const { w, h } = view;

    const bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#141a35');
    bg.addColorStop(1, '#0a0d1a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    // ブロック
    for (const b of bricks) {
      const r = brickRect(b);
      ctx.fillStyle = b.color;
      ctx.globalAlpha = b.hp > 1 ? 1 : 0.9;
      roundRect(r.x, r.y, r.w, r.h, r.h * 0.3);
      ctx.globalAlpha = 1;
      if (b.hp > 1) {
        // 硬いブロックの印
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        roundRect(r.x + r.w * 0.3, r.y + r.h * 0.36, r.w * 0.4, r.h * 0.2, r.h * 0.1);
      }
    }

    // 破片
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      const s = ball.r * 0.55;
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;

    // パドル
    ctx.fillStyle = '#e8ecff';
    ctx.shadowColor = 'rgba(77,195,255,0.7)';
    ctx.shadowBlur = 14;
    roundRect(paddle.x - paddle.w / 2, paddle.y - paddle.h / 2, paddle.w, paddle.h, paddle.h / 2);
    ctx.shadowBlur = 0;

    // ボール
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(255,255,255,0.85)';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  /* ---------- HUD / オーバーレイ ---------- */

  function syncHud() {
    ui.score.textContent = String(score);
    ui.level.textContent = String(level);
    ui.best.textContent  = String(best);
    ui.lives.textContent = '♥'.repeat(Math.max(0, lives)) || '—';
  }

  function showOverlay(title, text, hint) {
    ui.title.textContent = title;
    ui.text.textContent = text;
    ui.hint.textContent = hint;
    ui.overlay.hidden = false;
  }

  function hideOverlay() {
    ui.overlay.hidden = true;
  }

  /* ---------- 入力（タッチ / マウス共通の Pointer Events） ---------- */

  function pointerX(e) {
    const rect = canvas.getBoundingClientRect();
    return clamp(e.clientX - rect.left, 0, view.w);
  }

  stage.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    paddle.targetX = pointerX(e);
    unlockAudio();

    if (scene === 'ready') launchBall();
    else if (scene === 'over') { resetGame(); showOverlay('ブロック崩し', '指でドラッグしてパドルを動かそう', '画面をタップしてスタート'); }
  });

  stage.addEventListener('pointermove', (e) => {
    e.preventDefault();
    // 指が触れている（またはマウス移動）ときだけ追従
    if (e.pointerType === 'mouse' && e.buttons === 0) return;
    paddle.targetX = pointerX(e);
  });

  stage.addEventListener('contextmenu', (e) => e.preventDefault());

  ui.sound.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    soundOn = !soundOn;
    ui.sound.textContent = soundOn ? '🔊' : '🔇';
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));

  document.addEventListener('visibilitychange', () => {
    // バックグラウンドから戻ったときに一時停止しておく
    if (document.hidden && scene === 'play') {
      scene = 'ready';
      restBallOnPaddle();
      showOverlay('一時停止', `スコア ${score}`, 'タップして再開');
    }
  });

  /* ---------- 効果音（WebAudio・ファイル不要） ---------- */

  let soundOn = true;
  let actx = null;

  function unlockAudio() {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (_) { /* 音が出せない環境では黙って諦める */ }
  }

  function beep(freq, dur = 0.05, type = 'square', vol = 0.05) {
    if (!soundOn || !actx) return;
    try {
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination);
      o.start();
      o.stop(actx.currentTime + dur);
    } catch (_) { /* noop */ }
  }

  /* ---------- メインループ ---------- */

  let last = 0;
  function frame(now) {
    if (!last) last = now;
    const dt = Math.min((now - last) / 1000, 1 / 30); // タブ復帰時の巨大な dt を防ぐ
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // オフラインでも起動できるようにキャッシュを登録する（file:// で開いた場合は失敗するが無害）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  resize();
  resetGame();
  showOverlay('ブロック崩し', '指でドラッグしてパドルを動かそう', '画面をタップしてスタート');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
