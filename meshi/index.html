<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>スクショ飯 — アプリとして入れる</title>
<meta name="description" content="行きたい店のスクショを撮っておくだけ。取り込めば勝手にストックされ、行った店はチェックで落とせる。" />
<meta name="theme-color" content="#12100e" />
<meta name="color-scheme" content="dark" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="スクショ飯" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta property="og:title" content="スクショ飯" />
<meta property="og:description" content="スクショを撮っておくだけで、行きたい店が貯まっていく。" />
<meta property="og:image" content="./icon-512.png" />
<script>
  // ホーム画面のアイコンから開いたときは、案内を挟まずアプリへ
  if (matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) {
    location.replace("./app.html");
  }
</script>
<style>
  :root { --bg: #12100e; --text: #f4ece2; --dim: #a39483; --amber: #f0a63c; --amber-soft: #f6c377; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    padding: max(28px, env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 70% at 50% -10%, #2a2118 0%, rgba(42,33,24,0) 62%),
      radial-gradient(90% 50% at 50% 106%, rgba(240,166,60,0.14) 0%, rgba(240,166,60,0) 55%),
      var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .mark {
    width: 116px; height: 116px; border-radius: 26px;
    box-shadow: 0 0 0 1px rgba(244,236,226,0.12), 0 24px 50px -22px rgba(0,0,0,0.9), 0 0 70px -28px rgba(240,166,60,0.7);
  }
  h1 {
    margin: 0; font-size: clamp(26px, 7.5vw, 36px); font-weight: 700;
    letter-spacing: 0.16em; text-indent: 0.16em; color: #fbe3bd;
    text-shadow: 0 0 24px rgba(240,166,60,0.4);
  }
  .lead { margin: -10px 0 0; font-size: 13.5px; line-height: 2; color: var(--dim); max-width: 20em; }
  .lead b { color: #fbe3bd; }
  .how {
    margin: 0; padding: 16px 20px; max-width: 24em; width: 100%;
    border-radius: 14px; background: rgba(244,236,226,0.045); border: 1px solid rgba(244,236,226,0.10);
    font-size: 12.5px; line-height: 2; color: var(--dim); text-align: left;
  }
  .how b { color: #fbe3bd; }
  .how ol { margin: 6px 0 0; padding-left: 1.3em; }
  .step {
    margin: 0; font-size: 13px; line-height: 2; color: var(--text); max-width: 24em;
    padding: 16px 20px; border-radius: 14px;
    background: rgba(244,236,226,0.05); border: 1px solid rgba(244,236,226,0.12);
  }
  .step b { color: #fbe3bd; }
  button {
    font: inherit; font-size: 16px; font-weight: 700; color: #241713;
    background: linear-gradient(180deg, var(--amber-soft), var(--amber));
    border: none; border-radius: 999px; padding: 15px 34px; cursor: pointer;
    box-shadow: 0 14px 30px -14px rgba(240,166,60,0.9);
  }
  button:disabled { opacity: 0.55; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  a.plain {
    color: var(--dim); font-size: 13px; text-decoration: none;
    border-bottom: 1px solid rgba(244,236,226,0.25); padding-bottom: 2px;
  }
  a.plain:hover { color: #fbe3bd; }
  .free { font-size: 11px; color: rgba(163,148,131,0.6); letter-spacing: 0.06em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<img class="mark" src="./icon-192.png" width="116" height="116" alt="" />

<h1>スクショ飯</h1>
<p class="lead">気になる店は<b>スクショ</b>で残してあるはず。<br />それを、そのまま行きたいリストにする。</p>

<div class="how">
  <b>使い方はこれだけ</b>
  <ol>
    <li>行きたい店を見つけたらスクショを撮る</li>
    <li>アプリで取り込む（何度選び直しても重複しません）</li>
    <li>行ったら写真の <b>✓</b> を押す。それだけで記録になります</li>
  </ol>
</div>

<button id="installBtn" type="button">📲 アプリとして入れる</button>
<p class="step" id="step" hidden></p>

<a class="plain" href="./app.html">このままブラウザで使う</a>
<p class="free">無料・広告なし・アカウント不要。保存はこの端末の中だけ</p>

<script>
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    // 1つ上の階層の別アプリ（ブロック崩し）の Service Worker がここまで
    // 面倒を見てしまっている端末がある。自前のが主導権を取ったら読み直す
    const home = new URL("./", location.href).href;
    const c = navigator.serviceWorker.controller;
    if (c && !c.scriptURL.startsWith(home)) {
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        const now = navigator.serviceWorker.controller;
        if (now && now.scriptURL.startsWith(home) && !sessionStorage.getItem("meshi-sw-heal")) {
          sessionStorage.setItem("meshi-sw-heal", "1");
          location.reload();
        }
      });
    }
    addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  }

  (() => {
    const btn = document.getElementById("installBtn");
    const step = document.getElementById("step");
    let deferred = null, ready = false;

    // Android / デスクトップ Chrome：この合図が来たらワンタップで入る
    addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferred = e;
      btn.hidden = false;
      step.hidden = true;
      ready = true;
    });

    btn.addEventListener("click", async () => {
      if (!deferred) { showSteps(); return; }
      btn.disabled = true;
      deferred.prompt();
      const { outcome } = await deferred.userChoice;
      deferred = null;
      btn.disabled = false;
      if (outcome === "accepted") return;
      btn.hidden = true;
      showSteps();
    });

    addEventListener("appinstalled", () => {
      btn.hidden = true;
      step.hidden = false;
      step.innerHTML = "入りました。<b>ホーム画面のアイコン</b>から開けます。<br />写真の<b>共有</b>メニューにも「スクショ飯」が出るようになります。";
    });

    function showSteps() {
      const ua = navigator.userAgent;
      const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const iosSafari = ios && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|Chrome/.test(ua);
      if (iosSafari) {
        step.innerHTML = "下の<b>共有ボタン</b>（□に↑）を押して、<br />「<b>ホーム画面に追加</b>」を選んでください。";
      } else if (ios) {
        step.innerHTML = "このページを <b>Safari</b> で開き直してから、<br />共有 →「<b>ホーム画面に追加</b>」。";
      } else {
        step.innerHTML = "ブラウザの <b>⋮ メニュー</b> を開いて、<br />「<b>アプリをインストール</b>」または「ホーム画面に追加」。";
      }
      step.hidden = false;
    }

    setTimeout(() => { if (!ready && step.hidden) showSteps(); }, 2500);
  })();
</script>
</body>
</html>
