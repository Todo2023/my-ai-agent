<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>えほんを よむ | えほんの棚（仮）</title>
<meta name="theme-color" content="#221d17" />
<meta name="color-scheme" content="light" />
<meta name="robots" content="noindex" /><!-- 試作のため検索避け。公開時にこの行を消す -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c25b3a'/%3E%3Cpath d='M6 8h9v17H6zM17 8h9v17h-9z' fill='%23fffaf2'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="reading">

<div class="reader">
  <div class="reader-bar">
    <a class="icon-btn" href="./" aria-label="たなに もどる">←</a>
    <span class="title" id="title">よみこんでいます…</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="ruby" type="button" aria-pressed="true">ふりがな</button>
    <!-- 日本語と英語を ならべて 読むための 切りかえ（?lang=en のときは 英語だけ） -->
    <button class="icon-btn" id="lang" type="button" aria-pressed="true">EN</button>
    <button class="icon-btn" id="speak" type="button" aria-pressed="false">🔊 よむ</button>
  </div>

  <div class="stage" id="stage">
    <img class="page-img" id="img" alt="" />
    <p class="page-text" id="text"></p>
    <p class="page-text en" id="text-en" lang="en"></p>
  </div>

  <div class="reader-foot">
    <button class="nav-btn" id="prev" type="button">◀ まえ</button>
    <span class="pageno" id="pageno"></span>
    <button class="nav-btn" id="next" type="button">つぎ ▶</button>
  </div>

  <div class="end" id="end">
    <div>
      <h2 id="end-title">おしまい</h2>
      <p id="end-note">よんでくれて ありがとう。</p>
      <div class="row">
        <button id="restart" type="button">もういちど よむ</button>
        <a id="end-back" href="./">ほかの えほん</a>
      </div>
      <!--
        保護者向けの応援リンク（sekkei/platform-kids.md）。
        **子ども向けのボタンにはしない。** 小さく、下に、大人の言葉で置く。
        config.js の SUPPORT_URL が本番のものになるまで reader.js が隠す。
      -->
      <p class="support" id="support" hidden>
        <a id="support-link" href="#" target="_blank" rel="noopener">
          おうちの方へ：この棚を応援する
        </a>
      </p>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script type="module" src="reader.js"></script>
</body>
</html>
