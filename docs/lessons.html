<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 受講者限定。検索には載せない。 -->
<meta name="robots" content="noindex, nofollow">
<title>講座資料の一覧｜思考力×AI統合講座</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/lesson.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="lessons.html">合同会社To<em>do</em> — 講座資料</a>
    <span class="navlinks">
      <a class="navlink" href="office.html">オフィスアワー →</a>
      <a class="navlink" href="topics.html">AI Topics →</a>
      <a class="navlink" href="index.html">トップへ →</a>
    </span>
  </div>
</nav>

<main class="wrap" id="main">
  <div class="lesson-head"><p class="aim">読み込んでいます…</p></div>
</main>

<footer>合同会社Todo　思考力×AI統合講座　受講者向け資料</footer>

<script src="assets/course.js"></script>
<script>
(function () {
  var main = document.getElementById('main');
  var esc = Course.esc;

  /* 鍵は文字より形のほうが早く分かる。読み上げには言葉で伝える */
  var LOCK = '<svg class="lockmark" viewBox="0 0 14 16" aria-hidden="true" focusable="false">'
    + '<path d="M3.4 7V4.6a3.6 3.6 0 1 1 7.2 0V7" fill="none" stroke="currentColor" '
    + 'stroke-width="1.5" stroke-linecap="round"></path>'
    + '<rect x="1.6" y="7" width="10.8" height="7.6" rx="1.2" fill="currentColor"></rect>'
    + '</svg><span class="visually-hidden">まだ開いていません</span>';

  /* 提出を求める回を、ぜんぶ出し終えたか */
  function allDone(data) {
    var gating = data.lessons.filter(function (x) { return x.gates; });
    return gating.length > 0 && gating.every(function (x) { return x.done; });
  }

  /* 表示名。決めておくと、質問やワークが「名前なし」で届かなくなる。
     決めていない人には、たたんだ状態ではなく**開いた状態**で出す。
     たたむと誰も決めないまま進む。 */
  function nameHtml(data) {
    var has = Boolean(data.name);
    return '<div class="naming' + (has ? ' is-set' : '') + '">'
      + '<div class="naming-head">' + (has ? '表示名' : 'はじめに、表示名を決めてください') + '</div>'
      + '<div class="naming-bar">'
      + '<input id="name" type="text" maxlength="20" autocomplete="off" spellcheck="false" '
      + 'aria-label="表示名" placeholder="呼び名（20文字まで）" value="' + esc(data.name || '') + '">'
      + '<button type="button" class="deck-btn asker-send" id="name-save">'
      + (has ? '変える' : '決める') + '</button>'
      + '<span class="naming-state" id="name-state" role="status"></span>'
      + '</div>'
      + '<p class="naming-note">質問とワークを出したとき、<b>運営にこの名前で届きます。</b>'
      + '決めていないと「名前なし」で届き、誰の質問か分からなくなります。<br>'
      + '<b>本名でなくてかまいません。</b>呼ばれたい名前を入れてください。'
      + '「みんなの質問」には出ません（<a href="privacy.html" target="_blank" '
      + 'rel="noopener">個人情報の取り扱い</a>）。</p>'
      + '</div>';
  }

  function wireName() {
    var box = document.getElementById('name');
    var btn = document.getElementById('name-save');
    var say = document.getElementById('name-state');
    if (!box || !btn) return;

    btn.addEventListener('click', function () {
      var v = box.value.trim();
      if (!v) { say.textContent = '空です'; box.focus(); return; }
      btn.disabled = true;
      say.textContent = '決めています…';
      Course.api('/name', { name: v }).then(function (res) {
        btn.disabled = false;
        if (!res.ok) { say.textContent = res.d.error || '決められませんでした'; return; }
        say.textContent = res.d.name + 'さん、で届きます';
        document.querySelector('.naming').classList.add('is-set');
      }).catch(function () {
        btn.disabled = false;
        say.textContent = '通信できませんでした';
      });
    });

    box.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); btn.click(); }
    });
  }

  function render(data) {
    var rows = data.lessons.map(function (x) {
      var state = !x.open ? LOCK : (x.done ? '提出済み' : (x.written ? '読めます' : '準備中'));
      var cls = !x.open ? 'is-locked' : (x.done ? 'is-done' : (x.written ? 'is-open' : 'is-wip'));
      var inner =
        '<span class="ln">' + esc(x.label) + '</span>'
        + '<span class="lt">' + esc(x.title) + '</span>'
        + '<span class="ld">' + esc(x.date) + '</span>'
        + '<span class="ls">' + state + '</span>';
      return x.open
        ? '<a class="lrow ' + cls + '" href="lesson.html?r=' + encodeURIComponent(x.slug) + '">' + inner + '</a>'
        : '<div class="lrow ' + cls + '" aria-disabled="true">' + inner + '</div>';
    }).join('');

    var open = data.lessons.filter(function (x) { return x.open; }).length;
    main.innerHTML =
      '<div class="lesson-head">'
      + '<div class="kicker">Curriculum</div>'
      + '<h1>講座資料</h1>'
      + '<p class="aim">ワークを提出すると、次の回が開きます。'
      + '先の回は、開くまで手元に届きません。</p>'
      + '<div class="facts"><span><em>いま読める回</em>' + open + ' / ' + data.lessons.length + '</span>'
      + (data.name ? '<span><em>ようこそ</em>' + esc(data.name) + 'さん</span>' : '')
      + '</div></div>'
      + nameHtml(data)
      + '<div class="lessonlist">' + rows + '</div>'
      + (allDone(data)
          ? '<p class="lafter"><a class="deck-btn" href="done.html">修了の画面を見る</a></p>'
          : '')
      + '<div class="ltopics">'
      + '<p class="lt-label">直接話す</p>'
      + '<p class="lt-body"><a href="office.html">オフィスアワー</a>は予約制です。'
      + '30分、1人ずつ。相談したいことを書いておくと、こちらで準備してから臨めます。</p>'
      + '</div>'
      + '<div class="ltopics">'
      + '<p class="lt-label">受講の有無にかかわらず読めます</p>'
      + '<p class="lt-body"><a href="topics.html">AI Topics</a>に、'
      + 'AIと「価値の見つけ方」をめぐるニュースを、そこから立てた問いつきで載せています。'
      + 'ワークのお題として使うこともあります。</p>'
      + '</div>'
      + '<p class="signout"><button type="button" class="deck-btn" id="signout">この端末から合言葉を消す</button></p>';

    wireName();

    document.getElementById('signout').addEventListener('click', function () {
      if (!confirm('次に開くとき、もう一度合言葉が要ります。よろしいですか。')) return;
      Course.setCode('');
      location.reload();
    });
  }

  function start() {
    if (!Course.code()) { Course.askCode(main, render); return; }
    Course.api('/me').then(function (res) {
      if (!res.ok) { Course.setCode(''); Course.askCode(main, render); return; }
      render(res.d);
    }).catch(function () {
      main.innerHTML = '<div class="lesson-head"><p class="aim">'
        + '読み込めませんでした。通信を確かめて、ページを開き直してください。</p></div>';
    });
  }
  start();
})();
</script>
</body>
</html>
