<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 受講者限定。検索には載せない。 -->
<meta name="robots" content="noindex, nofollow">
<title>修了｜思考力×AI統合講座</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/lesson.css">
<link rel="stylesheet" href="assets/done.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="lessons.html">合同会社To<em>do</em> — 講座資料</a>
    <span class="navlinks">
      <a class="navlink" href="topics.html">AI Topics →</a>
      <a class="navlink" href="lessons.html">資料の一覧 →</a>
    </span>
  </div>
</nav>

<main class="wrap" id="main">
  <div class="lesson-head"><p class="aim">読み込んでいます…</p></div>
</main>

<footer>合同会社Todo　思考力×AI統合講座　受講者向け資料</footer>

<script src="assets/course.js"></script>
<script>
/* 最後の回を出し終えた人の画面。
   「見た人が修了」ではなく、**サーバーが持っている提出の記録**で判定する。
   URLを直接開いただけの人には、まだ残っている回を出す。 */
(function () {
  var main = document.getElementById('main');
  var esc = Course.esc;

  function render(d) {
    var gating = d.lessons.filter(function (x) { return x.gates; });
    var done = gating.filter(function (x) { return x.done; });
    var rest = gating.filter(function (x) { return !x.done; });

    if (rest.length) {
      /* まだ終わっていない人。責めずに、次に出すものだけを示す */
      var nextUp = rest[0];
      main.innerHTML =
        '<div class="lesson-head">'
        + '<div class="kicker">Curriculum</div>'
        + '<h1>まだ残っている回があります</h1>'
        + '<p class="aim">修了の画面は、提出を求める回をすべて出し終えると開きます。'
        + 'いまは' + done.length + ' / ' + gating.length + '回です。</p>'
        + '<div class="facts"><span><em>次に出すもの</em>'
        + esc(nextUp.label) + '　' + esc(nextUp.title) + '</span></div>'
        + '</div>'
        + '<p class="dn-back"><a class="deck-btn" href="lesson.html?r='
        + encodeURIComponent(nextUp.slug) + '">' + esc(nextUp.label) + 'へ</a>　'
        + '<a class="btn-text" href="lessons.html">資料の一覧に戻る</a></p>';
      return;
    }

    var rows = done.map(function (x) {
      return '<a class="dn-row" href="lesson.html?r=' + encodeURIComponent(x.slug) + '">'
        + '<span class="ln">' + esc(x.label) + '</span>'
        + '<span class="lt">' + esc(x.title) + '</span></a>';
    }).join('');

    main.innerHTML =
      '<div class="dn-head">'
      + '<div class="kicker">Complete</div>'
      + '<h1>' + (d.name ? esc(d.name) + 'さん、' : '') + '全' + gating.length + '回、出し切りました。</h1>'
      + '<p class="dn-lead">ここまでに出したものは、すべて手元に残っています。'
      + '<b>この講座で渡したのは答えではなく、問いの立て方でした。</b>'
      + '使えるかどうかは、これから自分で確かめてください。</p>'
      + '</div>'

      + '<section class="dn-sec">'
      + '<h2>これから、この型をどう使うか</h2>'
      + '<ol class="dn-next">'
      + '<li><b>第12回で作ったチェックリストを、月に一度見直す。</b>'
      + '使わなかった項目は消してください。手元に残すのは、自分が本当に使うものだけです。</li>'
      + '<li><b>ニュースを1本、問いに変える。</b>'
      + '<a href="topics.html">AI Topics</a>に、当社が選んだニュースと、そこから立てた問いを載せています。'
      + '同じことを自分でやるのが、いちばん軽い練習です。</li>'
      + '<li><b>詰まったら、また聞いてください。</b>'
      + '資料と質問欄は、修了後もそのまま開いたままにしてあります。</li>'
      + '</ol>'
      + '</section>'

      + '<section class="dn-sec">'
      + '<h2>出し切った回</h2>'
      + '<div class="dn-list">' + rows + '</div>'
      + '</section>'

      + '<p class="dn-back"><a class="btn-text" href="lessons.html">資料の一覧に戻る</a>　'
      + '<a class="btn-text" href="topics.html">AI Topics を見る</a></p>';
  }

  function start() {
    Course.api('/me').then(function (res) {
      if (!res.ok) {
        Course.setCode('');
        Course.askCode(main, render);
        return;
      }
      render(res.d);
    }).catch(function () {
      main.innerHTML = '<div class="lesson-head"><p class="aim">'
        + '読み込めませんでした。通信を確かめて、ページを再読み込みしてください。</p></div>';
    });
  }

  if (!Course.code()) Course.askCode(main, render);
  else start();
})();
</script>

</body>
</html>
